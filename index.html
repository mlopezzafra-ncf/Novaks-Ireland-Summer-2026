                {
                    date: 'June 3',
                    location: 'Slea Head Drive \u2192 Ballyferriter',
                    highlight: 'Dingle Peninsula & Blasket Islands',
                    backgroundImage: 'dingle.png',
                    briefing: 'Drive leisurely along Slea Head Drive — one of the most stunning stretches of the Wild Atlantic Way. Visit the Blasket Centre, see Iron Age beehive huts, gaze out to the evacuated islands, and overnight in Ballyferriter, deep in Irish-speaking country. Dinner tonight at the Ceann Sibéal Hotel where you’re staying, then a traditional music session at one of the village pubs — Tigh Uí Chatháin (Kane’s Bar) and/or Tigh Uí Mhurchú (Murphy’s Pub) — both a short walk from the hotel.',
                    coordinates: { lat: 52.1748, lng: -10.3886 },
                    hotel: "Ceann Sib\u00E9al Hotel",
                    hotelDetails: "Confirmation #6720768429661 under John Novak \u2014 two Deluxe Double rooms with sea view, 1 night (Wed 3 \u2192 Thu 4 Jun), 4 adults total. Standard rate includes breakfast; free cancellation up to 48 hrs before arrival. Card on file is charged 24\u201348 hrs before arrival. Check-in from 4 PM, check-out by 11 AM (late check-out to 3 PM available for a fee). Ballyferriter (Baile an Fheirt\u00E9araigh), Dingle V92 Y4EK \u2014 in the heart of the Irish-speaking Gaeltacht. Phone: +353 66 9156 433 | info@ceannsibealhotel.com.",
                    guide: [
                        { name: 'Gallarus Oratory', type: 'ancient', desc: 'A perfectly preserved 6th–9th century dry-stone Christian oratory — not a drop of water has got in in 1,200 years.', tip: '€3 through the visitor centre, or wander around the outside for free.' },
                        { name: 'Beehive Huts (Fahan)', type: 'ancient', desc: 'Cluster of Iron Age / early medieval clocháns — drystone domed houses right on Slea Head Drive.', tip: '€3 honesty box at the farm gate. Most atmospheric of the several groups.' },
                        { name: 'Blasket Centre (Ionad an Bhlascaoid)', type: 'museum', desc: 'Extraordinary museum in Dún Chaoin about the evacuated Blasket islanders and their literary legacy.', tip: '€5. Allow 90 minutes. The film at the start is worth staying for.' },
                        { name: 'Dunquin Pier (Céibh Dhún Chaoin)', type: 'viewpoint', desc: 'The zigzag concrete path down to the pier is one of Ireland\'s most-photographed views — straight out to the Blaskets.', tip: 'Park at the car park and walk down; don\'t try to drive it.' },
                        { name: 'Cupán Séar (Dunquin)', type: 'cafe', desc: 'Wonderful little café at Dunquin Pier. Home-made brownies, hot soup, sea views.', tip: 'Brownies are the order. Often busy at midday.' },
                        { name: "Ceann Sibéal Hotel Restaurant — Dinner (tonight)", type: 'restaurant', desc: "Dinner at the hotel where you’re staying — convenient and easy after a long Slea Head day, no driving required. The Ceann Sibéal’s dining room serves a Modern Irish menu rooted in West Kerry produce: lamb from the surrounding hills, fish landed at Dingle and Brandon Bay, Annascaul black pudding, vegetables and herbs from peninsula growers. Big sea-view windows look out across the Gaeltacht towards the Three Sisters. Quiet, candlelit, and the room often has bilingual Irish/English chatter.", tip: "Ask reception about reservation times in advance — the dining room can fill on summer evenings even with hotel guests. Casual dress." },
                        { name: 'Tigh Uí Chatháin / Kane’s Bar (Ballyferriter)', type: 'pub', desc: 'Thatched pub in the village — Irish is the first language here. Low-key trad sessions and local conversation. A short walk from the Ceann Sibéal Hotel.', tip: 'Listen more than speak; a "Dia duit" and a smile go a long way. Ask the bartender which nights the session is on.' },
                        { name: "Tigh Uí Mhurchú / Murphy’s Pub (Ballyferriter)", type: 'pub', desc: "Sister-village pub in Ballyferriter — small, whitewashed, very local. Often has a spontaneous traditional music session, especially at weekends. The other obvious choice in the village if Kane’s is quiet.", tip: "Both Ballyferriter pubs are within a 5-minute walk of the Ceann Sibéal Hotel — easy to pop into one and walk over to the other." },
                        { name: 'Dunbeg Fort', type: 'ancient', desc: 'Promontory fort perched on a cliff, dating from the Iron Age. Spectacular setting, small interpretive centre.', tip: 'Currently partially closed after a cliff collapse — check status at the centre before walking out.' },
                        { name: 'Riasc Monastic Site', type: 'ancient', desc: 'Ruined early-Christian monastery with a decorated pillar stone — a quiet alternative to busier sites.', tip: 'Free. 5 minutes from the main road; well signed.' }
                    ],
                    funFact: 'The Blasket Islanders produced, proportional to their population (never more than 175 souls), more great books than anywhere on earth. Peig Sayers dictated her autobiography because she couldn\'t write — it became required Irish-school reading and a national meme.',
                    historical: 'The Blasket Islands were evacuated on November 17, 1953 after decades of population decline — the government could no longer guarantee winter supplies. Their hardship gave rise to a literary tradition (An tOileánach, Fiche Blian ag Fás, Peig) now celebrated worldwide. The surrounding Gaeltacht is one of the last strongholds of Irish as a daily living language.',
                    articles: [
                        { title: "The Last of the Blasket Evacuees: \u2018We Weren\u2019t Great Mixers on the Mainland\u2019", source: 'Irish Times', url: 'https://www.irishtimes.com/life-and-style/people/the-last-of-the-blasket-evacuees-we-weren-t-great-mixers-on-the-mainland-1.1831611', desc: 'Personal memoir from the last surviving member of the 1953 evacuation.' },
                        { title: 'A Gathering on the Blaskets: An Islandman Returns', source: 'Irish Times', url: 'https://www.irishtimes.com/life-and-style/people/a-gathering-on-the-blaskets-an-islandman-returns-1.1400161', desc: '93-year-old islander recalls the evacuation and what was lost.' },
                        { title: 'Lost in the Mists of Time', source: 'Irish Times', url: 'https://www.irishtimes.com/life-and-style/lost-in-the-mists-of-time-1.1151618', desc: 'Atmospheric travel essay walking the Great Blasket through cloud and rain.' },
                        { title: 'The Great Blasket Island (archival video)', source: 'RTÉ Archives', url: 'https://www.rte.ie/archives/2018/1117/1010914-the-great-blasket-island/', desc: 'Ireland\u2019s national broadcaster archival documentary footage.' },
                        { title: 'Slea Head Drive', source: 'Lonely Planet', url: 'https://www.lonelyplanet.com/articles/slea-head-drive', desc: 'The definitive guide to the most dramatic drive on the peninsula.' },
                        { title: 'Where Irish Is Still Spoken: A Journey to the Gaeltacht', source: 'The Guardian', url: 'https://www.theguardian.com/travel/2017/nov/04/ireland-gaeltacht-irish-speaking-regions', desc: 'On the living Irish language in the western Gaeltacht regions.' }
                    ]
                },
                {
                    date: 'June 4',
                    location: 'Ballyferriter \u2192 Doolin, County Clare',
                    highlight: 'Cliffs of Moher at Sunset',
                    backgroundImage: 'doolin.png',
                    briefing: 'Drive north from Kerry to Doolin, County Clare (about 4 hours with the Tarbert ferry). Visit the Cliffs of Moher in the evening — the sun doesn\'t set until 10:15 PM in June — and settle into Doolin, Ireland\'s unofficial capital of traditional music. Dinner and a trad session tonight at Fitz’s Pub, right on site at Hotel Doolin where you’re staying — zero walking required after the Cliffs.',
                    coordinates: { lat: 52.9904, lng: -9.3868 },
                    hotel: "Hotel Doolin \u2014 Piper\u2019s Chair Self-Catering House",
                    hotelDetails: "Booking #5518 under John Novak \u2014 Houses @ Hotel Doolin, one-night stay. Two-storey self-catering house with open-plan kitchen/living/dining downstairs, three bedrooms and a shared family bathroom upstairs; sleeps up to 5. For 4 adults. Pay at hotel. Arrival from 3 PM Thu 4 Jun, collect keys at Hotel Doolin reception 4\u20139 PM. Check-out strictly by 12 PM Fri 5 Jun. Fitz Cross, Doolin, Co. Clare. Phone: 065 707 4111 | reservations@hoteldoolin.ie. Fitz\u2019s Pub on site with nightly trad sessions; McGann\u2019s (6 min walk) & McDermott\u2019s (7 min walk) also have nightly music. Cliffs of Moher just 9 km away.",
                    guide: [
                        { name: 'Tarbert – Killimer Ferry', type: 'quirky', desc: 'Shannon estuary car ferry — cuts 137 km off the drive and is half the fun. 20-minute crossing.', tip: '€25 one-way. Sailings every 30 min, no reservation needed.' },
                        { confirmed: true, name: 'Cliffs of Moher Experience — 4–9 PM (BOOKED)', type: 'viewpoint', desc: "Booking #494817 under John Novak — Thu 4 Jun, 4:00–9:00 PM arrival window for 4 (2 × Adult, 2 × Senior). The Cliffs rise 214 m straight out of the Atlantic and run for 14 km along the Clare coastline — Ireland’s most-visited natural attraction and part of the Burren and Cliffs of Moher UNESCO Global Geopark. They were formed roughly 320 million years ago from layers of shale and sandstone deposited at the mouth of a vast ancient river delta. The midpoint tower, O’Brien’s Tower, was built in 1835 by local landlord Cornelius O’Brien — partly as a viewing platform, partly to impress female tourists, and partly to provide work for famine-era labourers. Today the Experience visitor centre is built into the hillside; the cliff-edge path stretches 3.5 km along safe enclosed trails (a new 800 m section was resurfaced in 2025 north of O’Brien’s Tower). On a clear evening you can see the Aran Islands and (from O’Brien’s Tower) the Twelve Bens of Connemara. May–July is peak season for puffins nesting in burrows along the cliff-top.", tip: "Tickets paid in full (€28 with online discount). Show booking 494817 on phone at the gate. Visitor centre closes at 9 PM but the cliff path stays open later — bring a torch for the walk back. Sunset in June is around 10:15 PM. Free Cliffs of Moher app has an excellent audio-guided tour. Pop-culture bonus: these are the “Cliffs of Insanity” in The Princess Bride and a Horcrux location in Harry Potter and the Half-Blood Prince.", link: 'https://www.cliffsofmoher.ie' },
                        { name: 'The Burren', type: 'walk', desc: 'Moonscape of limestone pavement — 350 million years old. Orchids and Arctic plants grow side by side.', tip: 'Drive through R480 between Ballyvaughan and Killfenora. Caherconnell Stone Fort sits in the middle.' },
                        { name: 'Poulnabrone Dolmen', type: 'ancient', desc: 'Iconic portal tomb in the Burren — 5,800 years old, older than the pyramids.', tip: 'Free, right off the R480. 10-minute stop.' },
                        { name: 'Aillwee Cave', type: 'quirky', desc: 'Prehistoric cave system with underground river. The onsite Burren Birds of Prey Centre is a quirky add-on.', tip: '€18 for cave + birds combo. Book online.' },
                        { name: "Fitz’s Pub (Hotel Doolin) — Dinner & Session (tonight)", type: 'pub', desc: "Dinner and the trad music session tonight, on-site at the hotel — the easiest possible end to the Cliffs of Moher day. Fitz’s is the in-house pub of Hotel Doolin (Fitz Cross, Doolin) with a full kitchen serving an Irish pub-classic menu: Atlantic seafood chowder with brown soda bread, beer-battered fish & chips, slow-braised Burren lamb stew, Irish beef burger, sticky toffee pudding. The trad session runs nightly through the summer with rotating local musicians on fiddle, bodhrán, flute, concertina and pipes — Doolin is the spiritual home of West-Clare traditional music, so even the “casual” sessions here are world-class.", tip: "Eat first (kitchen serves into the early evening), then linger for the session — usually starts ~9 PM, arrive by 8:30 PM to get a seat near the musicians. No need to book a table for hotel guests but pop in earlier in the day to mention you're staying on-site." },
                        { name: "McGann\'s Pub", type: 'pub', desc: 'One of Doolin\'s three famous session pubs. Small, lively, family-run since 1936.', tip: '6-minute walk from the hotel. Best pints around.' },
                        { name: "Gus O\'Connor\'s Pub", type: 'pub', desc: 'The oldest of the Doolin three (1832). Home of the town\'s traditional music revival in the 1970s.', tip: 'Good food all day. Sessions start 9:30pm.' }
                    ],
                    funFact: 'The Cliffs of Moher appear as the "Cliffs of Insanity" in The Princess Bride and as a Horcrux location in Harry Potter and the Half-Blood Prince. Those puffins you\'re spotting nest in burrows up to a metre deep in the cliff-top turf.',
                    historical: 'The Cliffs of Moher were formed about 320 million years ago from shale and sandstone at the mouth of an ancient river delta. O\'Brien\'s Tower at the midpoint was built in 1835 by Cornelius O\'Brien, a local landlord, mostly to impress female tourists. Doolin became a global pilgrimage site for Irish music in the 1970s when flutist Micho Russell was discovered by American folk fans.',
                    articles: [
                        { title: 'Cliffs of Moher — Official Site', source: 'cliffsofmoher.ie', url: 'https://www.cliffsofmoher.ie', desc: 'Best times to visit, webcam, and trail maps.' },
                        { title: 'Doolin: The Home of Irish Traditional Music', source: 'Lonely Planet', url: 'https://www.lonelyplanet.com/ireland/county-clare/doolin', desc: 'Editor\u2019s guide to Doolin\u2019s music pubs, cliffs, and ferries.' },
                        { title: "The Burren: Ireland\u2019s Lunar Landscape", source: 'Irish Times', url: 'https://www.irishtimes.com/life-and-style/travel/the-burren-ireland-s-lunar-landscape/', desc: 'Travel essay on the limestone pavement and its hidden plant life.' }
                    ]
                },
                {
                    date: 'June 5',
                    location: 'Aran Islands \u2192 Dublin',
                    highlight: 'Inisheer by Morning, Dublin by Night',
                    backgroundImage: 'aran-islands.png',
                    briefing: "10:00 AM ferry from Doolin Pier to Inis O\u00EDrr (Inisheer), the smallest and most easterly of the Aran Islands \u2014 a 20-minute crossing. Explore by pony trap, see the Plassey shipwreck, wander an ancient castle, and catch the 1:45 PM return ferry back to Doolin. After lunch, drive ~3 hours east to Dublin and check into The Green hotel near St Stephen\u2019s Green. Dinner at Delahunt at 5:30 PM, then up to the Abbey Theatre for The Whiteheaded Boy at 7:30 PM.",
                    coordinates: { lat: 53.06, lng: -9.51 },
                    hotel: 'The Green (Dublin)',
                    hotelDetails: "Confirmation #267716609 \u2014 two Green King rooms (2 adults each) for 1 night, Fri 5 \u2192 Sat 6 Jun. Room 1 booked under John Novak, includes breakfast. Room 2 booked under Emily Novak Waight, room only. Advance Purchase rate, paid in full, non-refundable (one date change permitted up to 7 days prior). Check-in 3:00 PM, check-out 11:00 AM. The Green is a boutique 4-star on St Stephen\u2019s Green \u2014 walking distance to Trinity College, Grafton Street, and most of central Dublin.",
                    guide: [
                        { confirmed: true, name: "Doolin Ferry to Inis O\u00EDrr \u2014 BOOKED", type: 'quirky', desc: "Order #2Y4N4Q1V3N6F5U1G under Rose Novak \u2014 4 adults, paid in full. Outbound booking #12558274: Doolin \u2192 Inis O\u00EDrr one-way 10:00 AM. Return booking #12558275: Inis O\u00EDrr \u2192 Doolin 1:45 PM. Walk straight to the pier \u2014 no ticket-office check-in required.", tip: "QR codes needed on every leg \u2014 save them to your phone or print before arriving at Doolin Pier. Sit at the back outside; crossings can be rough. Bonus: use code \u201Caillwee10\u201D for 10% off the Aillwee Burren Experience.", image: 'doolin-ferry.jpg', link: 'https://doolinferry.com/' },
                        { confirmed: true, name: "Delahunt \u2014 Dinner 5:30 PM (BOOKED)", type: 'restaurant', desc: "Reservation #4J6PN87JLJY5 under Pamela Novak \u2014 Fri 5 Jun, 5:30\u20137:15 PM seating for 4. 39 Camden Street Lower, Dublin 2 (10-minute walk south of The Green). One of Dublin\u2019s great modern Irish dining rooms, set in a beautifully restored Victorian grocery shop dating from 1845 \u2014 the original Delahunt\u2019s of Camden Street is even mentioned in James Joyce\u2019s Ulysses. Today the kitchen turns out elegant, ingredient-led Irish cooking: Wicklow venison, Skeaghanore duck, Lough Neagh eel, hand-dived scallops, with wild herbs and seasonal vegetables from small Irish growers. The award-winning cocktail bar is on the first floor and opens at 5 PM \u2014 arrive a bit early for a pre-dinner drink.", tip: "Casual dress code; weekend tables require a 2-course minimum per guest. Cancellation: \u20AC20 per person if cancelled or numbers reduced with under 24 hrs notice (under 48 hrs for parties of 5+). Call +353 1 598 4880 if running late. Website: delahunt.ie. \u26A0 Tight turn from 7:15 PM dinner to 7:30 PM curtain at the Abbey \u2014 order a taxi at Delahunt for 7:10.", link: 'https://delahunt.ie' },
                        { confirmed: true, name: "Abbey Theatre \u2014 The Whiteheaded Boy, 7:30 PM (BOOKED)", type: 'site', desc: "Order #2234150 under John Novak \u2014 Fri 5 Jun, 7:30 PM curtain. 4 \u00D7 Section A seats: H18, H17, H16, H15 (\u20AC142 + \u20AC6 fees = \u20AC148, paid). 26 Lower Abbey Street, Dublin 1 \u2014 about 2 km / 7-min taxi north of Delahunt. The Abbey is Ireland\u2019s National Theatre, founded in 1904 by W.B. Yeats and Lady Augusta Gregory as the cradle of modern Irish drama. It premiered Synge\u2019s The Playboy of the Western World (1907) \u2014 which provoked riots in the auditorium \u2014 and Sean O\u2019Casey\u2019s Juno and the Paycock (1924). The original building was destroyed by fire in 1951; the theatre we\u2019ll see was rebuilt on the same site in 1966.\n\nThe play: The Whiteheaded Boy by Lennox Robinson (1886\u20131958) first opened on this stage in 1916 and has been a beloved staple of Irish comic drama ever since. It\u2019s a witty 3-act satire about the Geoghegan family of a small Irish town, who\u2019ve drained their savings sending their charming, idle youngest son Denis (the \u201Cwhiteheaded boy\u201D = favourite, the spoiled darling) to medical school in Dublin year after year while he keeps failing his exams. When he finally returns home to face the family \u2014 and his fianc\u00E9e, and the neighbours \u2014 Robinson skewers Irish small-town pretension, mother-love, sibling resentment, and the polite hypocrisies that hold a community together. Funny, sharp-eyed, and very Irish.", tip: "Curtain is 7:30 PM sharp. Latecomers may not be seated until interval \u2014 leave Delahunt by 7:10 PM. Box office +353 (0)1 87 87 222 / boxoffice@abbeytheatre.ie. After the show it\u2019s ~15 min walk back to The Green.", link: 'https://www.abbeytheatre.ie' },
                        { name: "O\'Brien\'s Castle (Caisleán Uí Bhriain)", type: 'ancient', desc: '14th-century tower-house high on the hill above the harbour — 360° views across the island and over to the Cliffs of Moher.', tip: 'Free. 20-minute walk up from the pier. Ruin open to the sky.' },
                        { name: 'Plassey Shipwreck', type: 'quirky', desc: 'Rusting hull of the MV Plassey, beached during a 1960 storm. Featured in the opening credits of Father Ted.', tip: 'On the east side of the island, walkable or by pony trap.' },
                        { name: 'Pony & Trap Tour', type: 'quirky', desc: 'Traditional jaunting car tour from the harbour — drivers narrate in English and Irish. About 1 hour.', tip: '€20 per head. Ask for Tomás or any of the regulars at the pier.' },
                        { name: 'Cill Gobnait', type: 'ancient', desc: 'Ruined 10th-century church and holy well dedicated to St. Gobnait, patron saint of bees and healing.', tip: 'Quiet, atmospheric, free. Take the path from behind the island\'s pub.' },
                        { name: 'Teach an Tae (Café)', type: 'cafe', desc: 'Tea house on the sand dunes — home-made scones, soup, smoked salmon. Thatched roof.', tip: 'Great lunch stop. Cash preferred.' },
                        { name: 'Tigh Ned', type: 'pub', desc: 'The island\'s pub — you\'ll end up here. Often a spontaneous session goes on in the afternoon.', tip: 'If you miss the last ferry (unlikely but), Tigh Ned has rooms.' }
                    ],
                    funFact: 'The Aran Islands have been one of Ireland\'s oldest Gaeltacht strongholds for over a thousand years. The distinctive cabled Aran sweater — once thought to carry family patterns used to identify drowned fishermen — is actually a 20th-century tourist-marketing invention. They\'re still beautiful sweaters.',
                    historical: 'The Aran Islands are where J. M. Synge came in 1898 on Yeats\'s advice to "go to the Aran Islands and find a life that has never been expressed in literature." His time there produced Riders to the Sea and The Playboy of the Western World. The islands remained almost entirely isolated until regular ferries began in the 1970s — which is why Gaeilge and traditional life endured so strongly here.',
                    articles: [
                        { title: 'Doolin Ferry Co. (our booking)', source: 'doolinferry.com', url: 'https://doolinferry.com/', desc: "Booked ferry operator \u2014 order #2Y4N4Q1V3N6F5U1G. QR code boarding passes needed on every leg." },
                        { title: 'The Aran Islands', source: 'Lonely Planet', url: 'https://www.lonelyplanet.com/ireland/the-aran-islands', desc: 'Editor-picked highlights across all three islands.' },
                        { title: 'J.M. Synge and the Aran Islands', source: 'History Ireland', url: 'https://historyireland.com/synge-and-the-aran-islands/', desc: 'How Yeats sent Synge to the islands and it changed Irish literature forever.' },
                        { title: 'Aran Islands', source: 'Atlas Obscura', url: 'https://www.atlasobscura.com/places/aran-islands', desc: "Atlas Obscura on the islands\u2019 distinctive culture, stone walls, and forts." },
                        { title: 'Aillwee Burren Experience', source: 'aillweeburrenexperience.ie', url: 'https://www.aillweeburrenexperience.ie/', desc: "Caves + birds of prey nearby \u2014 use code \u201Caillwee10\u201D for 10% off online admission." }
                    ]
                },
                {
                    date: 'June 6',
                    location: "Dublin \u2192 Northern Ireland (Bushmills)",
                    highlight: "Giant\u2019s Causeway & Bushmills",
                    backgroundImage: 'belfast.png',
                    briefing: "Check out of The Green by 11 AM and drive from Dublin up the M1 motorway into Northern Ireland (about 3 hours to Bushmills). Straight into the 1:00 PM Premium Tour & Tasting at Old Bushmills Distillery, then at 4:00 PM Pam crosses the Carrick-a-Rede rope bridge (15-min drive east). Dinner at 6:00 PM at The Bushmills Inn (booked) \u2014 or if timing is tight, classic fish & chips at Flash in the Pan (first choice) or The Hip Chip (second choice) on the way back. After dinner, head to UNESCO-listed Giant\u2019s Causeway for the long summer evening \u2014 sunset is around 10 PM, the crowds are gone, and the basalt columns are at their most cinematic. Short walk back to the Grays Bushmills for the night.",
                    coordinates: { lat: 55.2056, lng: -6.5261 },
                    hotel: 'Grays Bushmills',
                    hotelDetails: "Booking #DY4C3RX under Prof. John Novak \u2014 Family Suite, 3 adults, 1 night (Sat 6 \u2192 Sun 7 Jun). Bed & Breakfast 2026 rate \u2014 includes a full Irish breakfast. Check-in 3:00\u201310:00 PM, cancellation deadline Thu 4 Jun 3:00 PM. Boutique guesthouse in Bushmills village, walking distance to the distillery and a short drive to the Causeway.",
                    guide: [
                        { confirmed: true, name: "Giant's Causeway — Evening visit, after dinner", type: 'site', desc: "40,000 interlocking basalt columns formed by a Paleogene volcanic eruption — UNESCO World Heritage since 1986. We're hitting it after dinner (roughly 8 PM onwards): the visitor centre will be closed but the stones themselves are open, the coach-tour crowds are gone, and the long Antrim summer evening means good light until ~10 PM. The headland faces west, so the columns glow against the setting sun.", tip: "Visitor centre closes at 6/7 PM but the stones are free 24/7 — park at the National Trust lot (free after 6 PM) and walk the 1 km down. Bring layers; the wind picks up at sunset. Sturdy shoes — the columns are uneven and can be slippery." },
                        { name: 'Causeway Coastal Walk', type: 'walk', desc: 'Cliff-top path from the Causeway towards Port na Spaniagh — some of Ireland\'s most dramatic coastline.', tip: 'The Shepherd\'s Steps route (red trail) is the classic 2 km loop. Windproof layers essential.' },
                        { confirmed: true, name: "Carrick-a-Rede Rope Bridge — 4:00 PM (BOOKED)", type: 'walk', desc: "National Trust ticket #DB4CCNM6 under Pamela Novak — Sat 6 Jun, 16:00–16:30 arrival window, 1 × Non-member adult ticket. The famous rope bridge sways 30 m above the sea, linking the mainland to the tiny island of Carrickarede (“rock of the casting”). Originally rigged by salmon fishermen over 350 years ago, replaced and reinforced many times — today’s two-handrail bridge is maintained by the National Trust. The walk in is 1 km from the car park: flat at first, then a steep hill and 186 stone steps down to the bridge. From the bridge on a clear day you can see Rathlin Island and the Scottish coast. Open 16:00–16:30 arrival; bridge closes earlier than the site. B15 Whitepark Road outside Ballintoy, BT54 6LS — 7 miles (~15 min) east of Bushmills.", tip: "Reserved parking is included with the ticket. Path includes 186 steps + steep hill — not suitable for John given his mobility. A 400 m viewing platform with telescope is wheelchair-accessible from the car park if Rose or John want to see the bridge from above. Show digital confirmation on arrival. Dogs welcome on lead but not across the bridge. The other three need their own tickets if they want to cross — book online at nationaltrust.org.uk/carrick-a-rede." },
                        { confirmed: true, name: 'Old Bushmills Distillery \u2014 Premium Tour & Tasting (BOOKED)', type: 'site', desc: "Booked Sat 6 Jun at 1:00 PM \u2014 Booking #9115176, 2.5-hour Premium Tour & Tasting for 3 (1 Adult, 1 Senior, 1 Driver), pre-paid. 2 Distillery Rd, Bushmills BT57 8XH. The world\u2019s oldest licensed whiskey distillery \u2014 King James I granted the original licence on 20 April 1608, making it 418 years old in 2026. Whiskey was being distilled on this site long before: the first record of \u201Cthe spirit\u201D (uisce beatha) here dates to 1276, when a Knight of Malta stopped for a dram. The Distillery Co. we know today was incorporated in 1784 under Hugh Anderson. Destroyed by fire in 1885 (rebuilt in the red-sandstone pagoda style you\u2019ll see today), bought by Irish Distillers in 1972, sold to Diageo in 2005 and then to Proximo Spirits in 2014, which still owns it. Every drop of Bushmills is triple-distilled.", tip: "Bring your booking ID 9115176. Email distillery.tours@bushmills.com or call +44 28 2073 3218 for any changes. The Distillery Reserve, only sold on-site, is the one to buy home.", link: 'https://bushmills.com' },
                        { name: 'Dunluce Castle', type: 'ancient', desc: 'Dramatic cliff-top ruin that inspired C. S. Lewis\'s Cair Paravel. The kitchen literally fell into the sea in 1639.', tip: '£6. A quick stop; 30 minutes is plenty.' },
                        { name: 'Dark Hedges (Bregagh Road)', type: 'quirky', desc: 'Beech-tree tunnel planted in the 18th century; Game of Thrones\' Kingsroad.', tip: 'Free. Go at dawn or dusk; midday is busy and underwhelming.' },
                        { confirmed: true, name: 'The Bushmills Inn — Dinner 6:00 PM (BOOKED)', type: 'restaurant', desc: "Reservation #BC77QHGZ under John Novak — Sat 6 Jun, 6:00 PM table for 3. Table required back by 8:00 PM (2-hour seating). 9 Dunluce Road, Bushmills BT57 8QG — a 2-minute walk from the Grays Bushmills hotel and just down the road from the distillery.\n\nThe Bushmills Inn is a beautifully restored 19th-century coaching inn in the heart of the village. The dining rooms are split across stone-walled cubbies with turf fires, gas lamps, and snug oak settles — the closest thing to time-travel dining you’ll find on the Causeway Coast. AA Rosette-winning kitchen led by long-time head chef Donna Thomson; cooking emphasises Antrim produce: Glenarm salmon, Lough Neagh eel, Comber Earlies potatoes, Glens of Antrim lamb, hand-dived scallops from the Causeway, and house-baked wheaten bread. Signature dishes: the seafood chowder (legendary on the north coast), the slow-cooked beef-and-Bushmills shoulder, and the buttermilk panna cotta with foraged elderflower.", tip: "Phone (0) 28 2073 3000 or email info@bushmillsinn.com to change anything. Smart-casual dress. Carrick-a-Rede 4 PM ticket ends at 4:30 — Carrick-a-Rede to the Inn is a 15-min drive, so you'll be back in plenty of time. Reservation system normally asks for a deposit on cancellation under 24 hrs notice.", link: 'https://www.bushmillsinn.com/dine/' },
                        { name: 'Babushka Kitchen Café (Portrush)', type: 'cafe', desc: 'Surf-shack café on the East Strand — great coffee, brunch, and a view of the Atlantic rollers.', tip: 'Brunch weekends gets busy by 11am.' },
                        { name: "Flash in the Pan — Dinner backup (first choice, fish & chips)", type: 'restaurant', desc: "Fall-back option if the timing slips and you can't make Bushmills Inn at 6 PM — Belfast's most-talked-about chippy of the last few years. Tiny, independent fish-and-chip shop on the Lisburn Road in south Belfast, beloved for hand-cut Comber Earlies, line-caught North Sea haddock and cod in a light beer batter, and the proper crisp \"fish supper\" you remember. Run by the team behind Belfast's Born & Bred, opened 2020 and immediately voted one of the best chippies in Northern Ireland by the Belfast Telegraph. Small menu, big quality: fish supper, scampi, mushy peas, curry sauce, pickled onions. Takeaway-led with a few stools.", tip: "Only triggers if you abandon Bushmills Inn — it's an hour-plus south-east, on the way back to Belfast. Best to call (028 9066 0500) and confirm hours; takeaway tends to be the move." },
                        { name: "The Hip Chip — Dinner backup (second choice, fish & chips)", type: 'restaurant', desc: "Second fallback if both Bushmills Inn and Flash in the Pan are off the table — a stylish modern chippy in central Belfast. Sustainably-sourced Atlantic cod and haddock, hand-cut chips fried in dripping or vegetable oil to order, plus a short list of pies, sausages and a very good battered halloumi for the non-fish eater.", tip: "Cathedral Quarter, walking distance from The Merchant if you'd rather just head straight to the hotel. Takeaway is the standard move; eat-in is limited." }
                    ],
                    funFact: "Irish legend says the giant Fionn mac Cumhaill (Finn McCool) built the Causeway as a bridge to Scotland to fight the giant Benandonner. When Fionn saw how huge Benandonner was, his wife Oonagh disguised Fionn as a baby — Benandonner fled back to Scotland and ripped up the bridge behind him. Remarkably, there\'s a matching set of basalt columns at Fingal\'s Cave in Scotland.",
                    historical: "The Causeway formed 50–60 million years ago when an intense volcanic eruption sent lava through a chalk bed; rapid cooling produced the hexagonal cracking pattern. It\'s been a tourist attraction since 1693 when Dublin academic Sir Richard Bulkeley wrote the first scientific paper on it. Bushmills Distillery received its royal license from King James I in 1608 — making every other whiskey distillery in the world younger.",
                    articles: [
                        { title: "How Giant\u2019s Causeway Formed Its Spectacular Array of Columns", source: 'Smithsonian Magazine', url: 'https://www.smithsonianmag.com/smart-news/researchers-reveal-how-giants-causeway-was-formed-180968806/', desc: 'Scientists recreated the formation in a lab — cooling between 1,544 and 1,634\u00B0F.' },
                        { title: "My Favorite Place in Northern Ireland: Giant\u2019s Causeway", source: 'National Geographic', url: 'https://www.nationalgeographic.com/travel/article/my-favorite-place-in-ireland-giants-causeway', desc: "A personal essay \u2014 \u201cthe pictures don\u2019t prepare you.\u201d" },
                        { title: "Giant\u2019s Causeway", source: 'Atlas Obscura', url: 'https://www.atlasobscura.com/places/giants-causeway', desc: 'Finn McCool legend plus practical visitor info.' },

                {

                    highlight: 'The Troubles & Titanic',
                    backgroundImage: 'belfast.png',
                    briefing: "Morning stroll through St George\u2019s Market (Friday\u2013Sunday, biggest on Saturday \u2014 food, live music, crafts) before lunchtime. Afternoon Tea at The Great Room (12:30 PM, 2-hour table) followed by the 2:00 PM 3-Hour Ultimate Belfast Experience Black Taxi Tour from The Merchant \u2014 Falls Road, Shankill Road, peace walls, and the murals that tell both sides of the story. Early evening at Titanic Belfast, one of the world\u2019s great museums. Dinner downstairs at The Merchant \u2014 first choice The Cloth Ear (the hotel\u2019s bistro pub), or Bert\u2019s Jazz Bar for dinner with a live jazz set.",
                    coordinates: { lat: 54.6006, lng: -5.9269 },
                    hotel: 'The Merchant Hotel',
                    hotelDetails: "Deluxe Twin Victorian Room (3 adults: John, Rose, Pam) \u2014 booked under Rose Novak, ref #1C9EDWK. 1 night, Sun 7 Jun \u2192 Mon 8 Jun. Check-in 3:00\u201311:00 PM, check-out 12 noon. Lowest Flexible Rate \u2014 pay at hotel, includes breakfast at The Great Room, rooftop hot tub, sauna & steam room, Wi-Fi. Twin-bed configuration, self-parking requested, dinner & drinks in hotel flagged. Cancellation deadline Sat 6 Jun 3:00 PM. 5-star Grade A listed Victorian building, 16 Skipper Street, Cathedral Quarter \u2014 same address as the 12:30 PM Afternoon Tea + 2 PM Black Taxi pickup.",
                    guide: [
                        { confirmed: true, name: '3-Hour Ultimate Belfast Experience (BelfastTours.com) — BOOKED', type: 'site', desc: "Booked for Sun 7 Jun at 2:00 PM pickup (updated from 1 PM to fit Afternoon Tea at 12:30) \u2014 pickup at The Merchant Hotel, 16 Skipper Street. Three passengers (John, Rose, Pam). Guides present Republican and Loyalist stories on a neutral basis. £45 deposit paid; £305 balance owed to the driver on the day. Total £350.", tip: "Cash preferred \u2014 not all drivers carry card machines, so bring \u00a3305 cash or ring to confirm card payment. Be in the Merchant lobby by 1:55 PM (the Great Room afternoon tea is in the same building \u2014 a 30-second walk to the curb). Booking managed at belfasttours.com \u2014 contact John Novak / pamelainasia@gmail.com / +1 434-566-8014." },
                        { name: 'Titanic Belfast', source: 'museum', type: 'museum', desc: 'A six-storey museum on the exact slipway where RMS Titanic was built. Atmospheric, emotionally-weighted, superb.', tip: 'Book timed tickets (£25). Allow 3 hours. SS Nomadic ticket next door is included.' },
                        { name: 'Ulster Museum', type: 'museum', desc: 'Ireland\'s best archaeology/art museum for its size — Egyptology, Irish art, dinosaur bones, Troubles history — all free.', tip: 'Free entry. The Troubles gallery on the top floor is essential.' },
                        { name: 'Crumlin Road Gaol', type: 'site', desc: 'Victorian prison used until 1996 — held Republican and Loyalist prisoners during the Troubles. Evocative guided tour.', tip: '£13. Tour lasts 75 minutes.' },
                        { name: "St George’s Market — Morning visit (before afternoon tea)", type: 'site', desc: "Plan: drop in to St George’s Market this morning, before the 12:30 PM Afternoon Tea at The Great Room. Friday–Sunday Victorian covered market on May Street, BT1 — food stalls, live music in the central aisle, local crafts, antiques, oysters and Belaster cheese. Awarded Best Large Indoor Market in the UK (NABMA). Opens 8 AM Friday & Saturday and 10 AM Sunday; busiest Saturday 9–11 AM when the food and music are at their peak. It’s about a 10-minute walk south from The Merchant Hotel.", tip: "Go for an Ulster fry, oysters, or a soda farl from St George's Bakery. Leave by ~11:45 AM to walk back to The Merchant for the 12:30 PM tea." },
                        { name: 'The Duke of York', type: 'pub', desc: 'Cathedral Quarter institution — sawdust floors, walls hung with old posters. Traditional music on certain nights.', tip: 'Check the board for session nights. 2 min walk from the hotel.' },
                        { confirmed: true, name: 'The Great Room Restaurant — Afternoon Tea 12:30 PM (BOOKED)', type: 'restaurant', desc: "OpenTable confirmation #88833 under John Novak — Sun 7 Jun, 12:30 PM table for 3 (John, Rose, Pam). 2-hour seating. 16 Skipper Street, Belfast (inside The Merchant Hotel, same building you’re sleeping in). Afternoon Tea experience from £46.50pp.\n\nThe Great Room is set in one of Northern Ireland’s most spectacular dining rooms — the former main banking hall of Ulster Bank, built in 1860. The room rises into Ireland’s largest Victorian domed ceiling (22 m / 23 m to the apex), elaborately frescoed, lit by a 9-foot Italian chandelier and ringed by ornate plasterwork, gold leaf and marble pilasters. It’s consistently named among the most beautiful restaurant interiors in the UK & Ireland.\n\nThe afternoon tea is the room’s signature: a three-tier silver stand with finger sandwiches (smoked salmon on dill, coronation chicken, cucumber & cream cheese), warm fresh-baked buttermilk scones with thick clotted cream and homemade strawberry preserves, and a parade of French patisserie (macarons, choux, fruit tarts). Loose-leaf teas to order, with a Champagne upgrade available. Vegetarian and gluten-free versions on request — call 028 9023 4888 ahead if needed.", tip: "Black Taxi Tour pickup is at 2 PM downstairs at the same address — perfect timing: leave the tea table around 14:00 and step out to the curb. No-show fee for afternoon tea is £20 per person. 20-min grace period; call 028 9023 4888 if delayed.", link: 'https://www.themerchanthotel.com/eat-drink/the-great-room-restaurant/' },
                        { name: "The Cloth Ear — Dinner (first choice, at The Merchant)", type: 'restaurant', desc: "The Merchant Hotel’s in-house bistro pub — sitting just behind the front lobby, all dark oak, leaded glass and an open fire. The kitchen is led by Merchant Hotel executive chef Stevie McCarry and turns out elevated comfort food: Glenarm salmon and chips with mushy peas, Comber Earlies, slow-braised Irish beef-and-Guinness stew with champ, fish pie under a cheddar-mash lid, sticky toffee pudding. The Cloth Ear was named after a 19th-century slang word for someone tone-deaf to drinking-house gossip — a wink at the building’s history.", tip: "30-second walk from your hotel room. No reservation needed for the bar tables but worth phoning ahead on a Sunday — 028 9026 2719. Smart-casual; live trad music some evenings." },
                        { name: "Bert’s Jazz Bar — Dinner (second choice, at The Merchant)", type: 'restaurant', desc: "Also at The Merchant, on the ground floor — a 1930s-styled jazz supper club with red leather banquettes, brass fittings and live jazz seven nights a week from 9 PM. The menu is a small French-American bistro card: oysters, steak frites, classic burgers, lobster mac & cheese, chocolate fondant. Cocktails are excellent (the Bert’s Manhattan is a signature).", tip: "Book a table early to secure good sight lines to the bandstand — 028 9026 2713 or via The Merchant front desk. The first jazz set starts at 9 PM, so an 8 PM dinner gets you straight into the music." },
                        { name: "Kelly’s Cellars", type: 'pub', desc: 'Oldest pub in Belfast (1720) — Wolfe Tone plotted the 1798 rebellion in the back room. Traditional music often in the afternoons.', tip: 'Go for the atmosphere; stay for the Guinness.' }
                    ],
                    funFact: 'Belfast\'s peace walls — concrete and steel barriers up to 7.5 m tall — separate Catholic and Protestant neighborhoods. Most were built after the 1998 Good Friday Agreement, not during the Troubles. The current plan is to remove them all by 2023. That deadline has now been moved to 2030.',
                    historical: 'The Troubles (1969–1998) killed 3,500+ people and injured over 47,000 in a conflict between Irish Republican and Ulster Loyalist paramilitaries, British security forces, and civilians. The Good Friday Agreement of 1998 established power-sharing government and the principle of consent — Northern Ireland\'s future will be decided by its people. RMS Titanic was built by Harland & Wolff in Belfast between 1909 and 1912. At its peak the shipyard employed 35,000 people.',
                    articles: [
                        { title: 'How the Troubles Began: A Timeline', source: 'Irish Times', url: 'https://www.irishtimes.com/news/ireland/irish-news/how-the-troubles-began-a-timeline-1.3987076', desc: 'Definitive chronology from Ireland\u2019s newspaper of record.' },
                        { title: "The Troubles \u2014 A Euphemism for Bloody Conflict", source: 'Irish Times', url: 'https://www.irishtimes.com/news/politics/the-troubles-a-euphemism-for-bloody-conflict-1.3983352', desc: "Why \u201cThe Troubles\u201d was chosen as a word \u2014 and what it conceals." },
                        { title: 'Belfast, 1969: The Troubles Were Coming', source: 'Irish Times', url: 'https://www.irishtimes.com/culture/books/belfast-1969-the-troubles-were-coming-1.3963024', desc: 'Memoir extract \u2014 the night the guns came out, from a Belfast man who was there.' },
                        { title: "Giving Voice to the Troubles: How Literature Told the North\u2019s Story", source: 'Irish Times', url: 'https://www.irishtimes.com/culture/books/giving-voice-to-the-troubles-how-literature-has-told-the-north-s-story-1.3642490', desc: 'How Seamus Heaney, Robert McLiam Wilson and others made sense of the conflict in fiction.' },
                        { title: '3-Hour Ultimate Belfast Experience (our booking)', source: 'belfasttours.com', url: 'https://www.belfasttours.com/', desc: "Booked Black Taxi Tour operator \u2014 pickup 2 PM at The Merchant Hotel, 3 passengers. \u00a345 deposit paid, \u00a3305 balance to the driver day-of (cash preferred)." },

                {
                    date: 'June 8',
                    location: 'Belfast \u2192 Dublin',
                    highlight: 'Return to the Capital',
                    backgroundImage: 'dublin-2.png',
                    briefing: "Early start: leave Belfast by 8 AM to drive 2 hours back to Dublin in time for the 11:45 AM guided tour of Kilmainham Gaol (arrive 11:30). Check into the Iveagh Garden Hotel from 4 PM, then the 4:30 PM Famous Guided Tour at The Little Museum of Dublin on St Stephen’s Green (5-min walk from the hotel). Dinner at Hera on Dorset Street at 6:30 PM.",
                    coordinates: { lat: 53.3351, lng: -6.2625 },
                    hotel: 'Iveagh Garden Hotel',
                    hotelDetails: "Deluxe Triple Room (3 adults) with complimentary breakfast at Elle\u2019s Bistro. 72/74 Harcourt Street, Dublin 2. Booking #41810 under John Novak \u2014 pay at hotel. Check-in from 4 PM Mon 8 Jun, check-out by 12 PM Tue 9 Jun (in time for the 11:10 AM Aer Lingus flight to JFK). Phone: +353 1 568 5500 | reservations@igh.ie. Cancellation policy: 48 hrs / 12 PM two days before arrival.",
                    guide: [
                        { confirmed: true, name: "The Little Museum of Dublin — Famous Guided Tour 4:30 PM (BOOKED · Manuel emailed)", type: 'museum', desc: "Ticketsolve order #445251981 under John Novak — Mon 8 Jun, 4:30 PM Famous Guided Tour (Manuel followed up by email; the booked slot is 4:30 PM, ~4 PM as Manuel noted). 3 tickets: 2 × Senior (€16) + 1 × Adult (€18) = €50 paid. QR codes: SVS24UKX2M, 29YQPFRL3S, OIIVSY3ILI. 15 St Stephen’s Green, Dublin 2 — a 5-minute walk from the Iveagh Garden Hotel.\n\nFounded in 2011 by journalist and historian Trevor White as “the people’s museum of Dublin,” The Little Museum sits in an elegant 18th-century Georgian townhouse on the north side of St Stephen’s Green. Every object in the collection was donated by a Dubliner — over 5,000 items in all, from JFK’s lectern when he addressed the Oireachtas in 1963, to Bono’s guitar, to a chunk of the Berlin Wall, a U2 award, a letter from James Joyce, posters from the 1916 Easter Rising, and Mary Robinson’s campaign material. The Famous Guided Tour (29 minutes, fast-paced and laugh-out-loud funny) is repeatedly voted the No. 1 attraction in Dublin on TripAdvisor and gives you a chronological story of the city in the 20th century — Joyce, the Rising, the Troubles, the rise of U2, the Celtic Tiger boom and crash, all the way to the marriage-equality referendum.\n\nThe museum reopened in 2024 after a multi-year restoration of the townhouse that doubled its exhibition space.", tip: "Show the QR codes on phones at the door. Tour starts on time and lasts ~30 min — be there by 4:25 PM. Wheelchair access is via the side entrance — call ahead +353 1 661 1000 if needed. After the tour, walk back through St Stephen’s Green to the hotel, then taxi to Hera at 6:30 PM.", link: 'https://www.littlemuseum.ie' },
                        { confirmed: true, name: "Hera — Dinner 6:30 PM (BOOKED)", type: 'restaurant', desc: "OpenTable confirmation #10768 under John Novak — Mon 8 Jun, 6:30 PM table for 3 in the Dining Room. 58 Dorset Street Lower, Dublin 1 (about 1 km / 5-min taxi north of the Iveagh Garden Hotel). Phone 089 402 0361.\n\nHera is one of Dublin's most-talked-about recent openings — listed in the Michelin Guide as a recommended restaurant since 2025. It calls itself an \"elevated gastropub\" but most critics agree the emphasis is firmly on \"gastro\": a refined kitchen with old-school boozer DNA in the room next door. The Irish Times review (Jan 2025) called it \"a new gastropub on Dublin's north side, without the usual clichés.\"\n\nChef Joe Smith leads the kitchen — young, classically trained, and previously of the Michelin-starred Bastible in Dublin 8 (under chef Barry Fitzgerald). The Hera ownership group also runs Achara (Aston Quay), Crudo (Sandymount) and The Fourth Corner (Dublin 8). Cooking is clever, original, and rooted in seasonal Irish produce — sharing plates and short, ingredient-led main courses. The room is warmly lit, with acoustic wood panelling, booth seating, and a customised Hertz U Audio sound system that has its own following.", tip: "Smart-casual. Ask the waiter what's on tonight from the daily-changing chalkboard — Joe Smith's specials are where the kitchen really shines. The wine list leans into low-intervention bottles. Cancellations through OpenTable.", link: 'https://heradublin.ie/' },
                        { confirmed: true, name: "Kilmainham Gaol Museum — Guided Tour 11:45 AM (BOOKED)", type: 'museum', desc: "Booking #982200 under John Novak — Mon 8 Jun, 11:45 AM guided tour. 1 × Adult + 2 × Senior 60+ = €20 paid. Arrive 11:30. Kilmainham Road, Dublin 8 (about 15 min taxi from the Iveagh Garden Hotel).\n\nKilmainham Gaol is the single most politically significant building in modern Irish history. Built in 1796 as a “new” model prison, it held men, women and children in equally grim conditions through the Famine years and the long arc of Irish republicanism — Robert Emmet in 1803; the Young Irelanders in 1848; the Fenians in 1867; the Land League’s Charles Stewart Parnell in 1881; the Invincibles after the Phoenix Park murders in 1882. Its most defining chapter is the aftermath of the 1916 Easter Rising: fourteen leaders of the Rising — including Patrick Pearse, James Connolly (carried in on a stretcher and tied to a chair to be shot), Thomas Clarke, Joseph Plunkett (who married Grace Gifford in the prison chapel the night before his execution), and Pearse’s brother Willie — were executed in the Stonebreakers’ Yard between May 3 and 12, 1916. Their deaths transformed Irish public opinion overnight and accelerated the path to independence. Éamon de Valera was the last prisoner released, in 1924, when the gaol finally closed.\n\nReopened as a museum in the 1960s after a remarkable volunteer restoration effort. The atmospheric stone-and-iron East Wing — a Victorian panopticon design with a glass-roofed central hall and three tiers of cells radiating outwards — is one of the most photographed prison interiors in the world; you may recognise it from films like In the Name of the Father, Michael Collins, and The Italian Job (1969). The Stonebreakers’ Yard at the rear is where the 1916 executions took place; two simple crosses now mark the spots.", tip: "Tour is 90 minutes and includes the East Wing, the chapel where Plunkett married Grace, and the Stonebreakers’ Yard. Show the QR code from John’s email on entry. Wear layers — the cell blocks stay cold even in June. Photography permitted inside, but no flash.", link: 'https://www.kilmainhamgaolmuseum.ie' },
                        { name: 'Brú na Bóinne (Newgrange)', type: 'ancient', desc: 'Neolithic passage tomb (3200 BC) older than Stonehenge or the pyramids. UNESCO World Heritage Site.', tip: 'Only accessible by shuttle from Brú na Bóinne Visitor Centre. Book online — day-of rarely available.' },
                        { name: 'Drogheda (town)', type: 'walk', desc: 'Medieval walled town on the River Boyne. Narrow streets, Gothic St. Peter\'s Church with the head of St. Oliver Plunkett.', tip: '30-minute stop on the way back. Worth the detour.' },
                        { name: 'Monasterboice', type: 'ancient', desc: 'Ruined early-Christian monastery with some of the finest high crosses in Ireland — Muiredach\'s Cross is 5.5 m tall.', tip: 'Free, atmospheric, usually empty. 15 min off the M1.' },
                        { name: 'James Joyce Centre', type: 'museum', desc: 'Elegant Georgian townhouse on North Great George\'s Street — Joyce\'s Dublin, rooms, Bloomsday programming.', tip: '€10. Small but perfectly formed. Great bookshop.' },
                        { name: 'MoLI (Museum of Literature Ireland)', type: 'museum', desc: 'Beautiful modern museum in UCD Newman House — Joyce\'s first edition of Ulysses, rotating shows.', tip: '€10. Café in the garden is lovely.' },
                        { name: 'Restaurant Patrick Guilbaud ★★', type: 'restaurant', desc: "Two-Michelin-star French-Irish fine dining in the Merrion Hotel — Dublin’s grandest and longest-running gastronomic address, holding two Michelin stars continuously since 1996 (almost 30 years). Founded by Paddy Guilbaud and Stéphane Robin; long-time head chef Guillaume Lebrun is at the stoves. The walls are hung with an extraordinary Irish art collection — Jack B. Yeats, Louis le Brocquy, William Scott — borrowed from the Merrion’s private collection. Signature dishes: the iconic ravioli of lobster (on the menu since 1981), Challans duck with cherries, Connemara hill lamb, the cheese trolley with 30+ aged Irish and French cheeses.", tip: 'Book 6+ weeks ahead via restaurantpatrickguilbaud.ie. The set lunch is the (almost) affordable way in. Jacket recommended for gentlemen. The wine list is one of the most serious in Ireland.' },
                        { name: "The Brazen Head", type: 'pub', desc: 'Ireland\'s oldest pub (1198) near Christ Church Cathedral — Wolfe Tone and Daniel O\'Connell both drank here.', tip: 'Food is fine, atmosphere is the reason. Traditional music most evenings.' },
                        { name: 'Sweny\'s Chemist', type: 'quirky', desc: 'The unchanged chemist shop from Ulysses — now run by volunteers who read Joyce aloud daily.', tip: 'Donations welcome. Buy the lemon soap Bloom bought.' }
                    ],
                    funFact: 'At Newgrange, on the dawn of the winter solstice, a narrow beam of sunlight penetrates a "roof box" above the entrance and travels down the 19-metre passage to light up the inner chamber — for 17 minutes. The builders nailed this alignment 5,200 years ago. A lottery assigns the 60 annual attendee spots.',
                    historical: 'Drogheda was the site of Oliver Cromwell\'s infamous 1649 siege — around 3,000 men, women, and children were killed when the town was stormed. The head of St. Oliver Plunkett, martyred in 1681, is preserved in a reliquary in St. Peter\'s Church. Dublin itself came into its modern form in the Georgian era (1714–1830), when the wide boulevards, squares, and red-brick townhouses we associate with the city were built.',
                    articles: [
                        { title: 'James Joyce Centre Dublin', source: 'jamesjoyce.ie', url: 'https://jamesjoyce.ie', desc: "Joyce\u2019s Dublin, rooms, Bloomsday programming and bookshop." },
                        { title: 'A Literary Dublin Walking Tour', source: 'The Guardian', url: 'https://www.theguardian.com/travel/2015/jun/08/dublin-literary-trail-ireland', desc: 'Sites of Joyce, Wilde, Beckett and Yeats \u2014 the definitive literary walk.' }
                    ]

                        { confirmed: true, name: "Newway Car Return (DUB) \u2014 10:00 AM", type: 'site', desc: "Return the Intermediate Estate Auto (Toyota Corolla Estate or similar) by 10:00 AM Tue 9 Jun. Booking #OFZ2FM32W4. Signposted \u201CRental Car Return\u201D at the airport \u2014 ground floor, short walk to Terminal 2.", tip: "Fill up at the airport fuel station en route (signed before rental return). Keep the fuel receipt \u2014 Newway asks for proof of top-up to avoid re-fuel surcharge." },
                        { confirmed: true, name: "Leg 1 \u2014 EI 0105 \u2022 Dublin \u2192 New York JFK (all three Novaks)", type: 'site', desc: "Tue 9 Jun 2026. Depart DUB 11:10 AM (Terminal 2) \u2192 Arrive JFK 1:40 PM (Terminal 7, Eastern Time). Flight time: 7h 30min. Operated by Aer Lingus \u2014 Airbus A330-300 widebody, 2\u20134\u20132 economy layout. Economy Class. John & Rose: booking 28BSD2, seats 22C (aisle) & 22A (window). Pam: booking 2D2F6F, seat 21A. Complimentary hot meal + mid-flight snack, complimentary wine & beer, seatback IFE with films, TV, music. 1 \u00D7 23kg checked bag per passenger. 2 \u00D7 Wheelchair for Ramp (John & Rose).", tip: "Arrive DUB 3 hrs early \u2014 US Customs pre-clearance happens in Dublin (you\u2019ll clear US immigration before boarding). When you land at JFK you\u2019re a domestic arrival, no customs line." },
                        { confirmed: true, name: "Layover \u2014 John F. Kennedy International (JFK)", type: 'quirky', desc: "At JFK the group splits. Pam has a 4h 20min layover (1:40 PM \u2192 6:00 PM) before flying to Tampa. John & Rose have a longer ~8h 45min wait (1:40 PM \u2192 10:25 PM) before their Syracuse flight. Both parties transfer from JFK Terminal 7 (Aer Lingus) to Terminal 5 (JetBlue) via the free JFK AirTrain \u2014 factor in 30\u201345 min.", tip: "Good chance for a farewell meal together at T5 (Deep Blue Sushi, Shake Shack, La Vie) before Pam boards her flight. T7 closes before John & Rose\u2019s connection, so transfer to T5 early." },

                        { confirmed: true, name: "Leg 2 (John & Rose) \u2014 EI 5080 \u2022 JFK \u2192 Syracuse", type: 'site', desc: "Tue 9 Jun 2026. Depart JFK 10:25 PM (Terminal 5) \u2192 Arrive SYR 11:52 PM. Flight time: 1h 27min. Operated by JetBlue (B6) on Aer Lingus code-share \u2014 typically Embraer E190 regional jet (2\u20132 seating). Economy (Q). Complimentary JetBlue snacks (Cheez-Its, Terra Chips, cookies) + drinks. Free DirecTV at seat + free Fly-Fi Wi-Fi. 1 \u00D7 23kg checked bag per passenger. 2 \u00D7 Wheelchair for Ramp.", tip: "Seat selection available at jetblue.com with booking LXRBKF from 24 hrs before. Landing just before midnight \u2014 arrange Syracuse ground transport in advance." },
                        { confirmed: true, name: "Wheelchair for Ramp \u2014 all legs", type: 'quirky', desc: "Pre-arranged curbside-to-gate assistance on both EI 0105 (Aer Lingus) and EI 5080 (JetBlue). Attendants will meet John & Rose at DUB curb \u2192 check-in \u2192 security \u2192 gate \u2192 JFK arrival \u2192 T7-to-T5 AirTrain \u2192 JetBlue gate \u2192 SYR baggage claim \u2192 curbside.", tip: "Re-confirm 24 hrs before departure with each airline. Mention the T7 \u2192 T5 connection explicitly \u2014 a second chair may be assigned for the AirTrain transfer." },
