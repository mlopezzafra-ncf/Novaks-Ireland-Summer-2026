                                                                                <a href={g.link} target="_blank" rel="noopener noreferrer">Visit website &rarr;</a>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                );
                                                                return (
                                                                    <>
                                                                        {confirmed.length > 0 && (
                                                                            <>
                                                                                <div className="section-title">Today&rsquo;s Plan</div>
                                                                                <div className="guide-grid">
                                                                                    {confirmed.map((g, gIdx) => renderCard(g, gIdx, `c-${gIdx}`))}
                                                                                </div>
                                                                            </>
                                                                        )}
                                                                        {possible.length > 0 && (
                                                                            <>
                                                                                <div className="section-title">Possible Things to Do</div>
                                                                                <div className="guide-grid">
                                                                                    {possible.map((g, gIdx) => renderCard(g, gIdx, `p-${gIdx}`))}
                                                                                </div>
                                                                            </>
                                                                        )}
                                                                    </>
                                                                );
                                                            })()}

                                                            {day.funFact && (
                                                                <>
                                                                    <div className="section-title">Fun Fact</div>
                                                                    <div className="fun-fact">{day.funFact}</div>
                                                                </>
                                                            )}

                                                            {day.historical && (
                                                                <>
                                                                    <div className="section-title">Historical Context</div>
                                                                    <div className="historical-note">{day.historical}</div>
                                                                </>
                                                            )}

                                                            {day.articles && day.articles.length > 0 && (
                                                                <>
                                                                    <div className="section-title">Read More</div>
                                                                    <div className="articles-list">
                                                                        {day.articles.map((a, aIdx) => (
                                                                            <div key={aIdx} className="article-card">
                                                                                <a href={a.url} target="_blank" rel="noopener noreferrer">{a.title}</a>
                                                                                <span className="article-source">{a.source}</span>
                                                                                <div className="article-desc">{a.desc}</div>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {/* CULTURE TAB */}
                            {activeTab === 'culture' && (
                                <div className="space-y-10">
                                    {/* Traditional Music */}
                                    <div className="day-card">
                                        <div className="day-card-corner-decoration">&#10022;</div>
                                        <div className="day-card-content">
                                            <p className="text-3xl gold-text mb-3 text-center" style={{ fontFamily: "'Cinzel', serif" }}>Traditional Irish Music</p>
                                            <p className="leading-relaxed mb-4">A <b>session</b> (<i>seisiún</i>) is a spontaneous conversation in music. Musicians gather in a pub — usually in a semi-circle at a corner table — and play tunes from memory. No one announces anything. Someone starts a jig or a reel; others fall in when they recognize it. Sets flow into one another. A good session is sacred: when the music is playing, you listen. Clap after a set, not during, and never mid-tune.</p>

                                            <div className="culture-subtitle">Essential Instruments</div>
                                            <div className="instrument-list">
                                                <div className="instrument-pill"><strong>Uilleann pipes</strong><span>Bellows-blown Irish bagpipes. Melancholy, complex, the great Irish voice.</span></div>
                                                <div className="instrument-pill"><strong>Fiddle</strong><span>Violin played with drive and ornament. Regional styles differ (Donegal, Sligo, Clare).</span></div>
                                                <div className="instrument-pill"><strong>Bodhr&aacute;n</strong><span>Frame drum played with a double-ended stick (tipper). The session\'s pulse.</span></div>
                                                <div className="instrument-pill"><strong>Tin whistle</strong><span>Six-hole metal flute. Cheap, portable, beautiful in the hands of a master.</span></div>
                                                <div className="instrument-pill"><strong>Concertina</strong><span>Small hexagonal squeezebox. Favored in Clare for its clarity.</span></div>
                                                <div className="instrument-pill"><strong>Flute (wooden)</strong><span>Simple-system wooden flute. Breathy, warm — very different to the classical silver flute.</span></div>
                                            </div>

                                            <div className="culture-subtitle">Essential Traditional Albums</div>
                                            <div className="album-grid">
                                                {traditionalAlbums.map((a, i) => (
                                                    <div
                                                        key={i}
                                                        className={`album-card ${a.image ? 'has-image' : ''}`}
                                                        style={a.image ? { background: `linear-gradient(180deg, rgba(250,246,240,0.15) 0%, rgba(250,246,240,0.55) 45%, rgba(250,246,240,0.95) 100%), url('${a.image}') center/cover no-repeat` } : {}}
                                                    >
                                                        <div className="album-title">{a.title}</div>
                                                        <div className="album-artist">{a.artist}</div>
                                                        <span className="album-year">{a.year}</span>
                                                        <div className="album-note">{a.note}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Modern Artists */}
                                    <div className="day-card">
                                        <div className="day-card-corner-decoration">&#10022;</div>
                                        <div className="day-card-content">
                                            <p className="text-3xl gold-text mb-3 text-center" style={{ fontFamily: "'Cinzel', serif" }}>Modern Irish Music</p>
                                            <p className="leading-relaxed mb-4 italic">Irish musicians who have shaped modern popular music — and the album to put on as you drive.</p>
                                            <div className="artist-grid">
                                                {modernArtists.map((a, i) => (
                                                    <div
                                                        key={i}
                                                        className={`artist-card ${a.image ? 'has-image' : ''}`}
                                                        style={a.image ? { background: `linear-gradient(180deg, rgba(250,246,240,0.12) 0%, rgba(250,246,240,0.55) 45%, rgba(250,246,240,0.95) 100%), url('${a.image}') center/cover no-repeat` } : {}}
                                                    >
                                                        <div className="artist-name">{a.name}</div>
                                                        <div className="artist-origin">{a.origin}</div>
                                                        <span className="artist-genre">{a.genre}</span>
                                                        <div className="artist-note">{a.note}</div>
                                                        <div className="artist-best"><strong>Listen:</strong> <span dangerouslySetInnerHTML={{ __html: a.best }}></span></div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Books to Read */}
                                    <div className="day-card">
                                        <div className="day-card-corner-decoration">&#10022;</div>
                                        <div className="day-card-content">
                                            <p className="text-3xl gold-text mb-3 text-center" style={{ fontFamily: "'Cinzel', serif" }}>Books for the Journey</p>
                                            <p className="leading-relaxed mb-4 italic">Read before, during, and after. The best preparation for Ireland is its writers.</p>
                                            <div className="book-grid">
                                                {booksList.map((b, i) => (
                                                    <div key={i} className="book-card">
                                                        <div className="book-title">{b.title}</div>
                                                        <div className="book-author">{b.author}</div>
                                                        <span className={`book-when ${b.when}`}>{b.whenLabel}</span>
                                                        <div className="book-note">{b.note}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Newspapers & Media */}
                                    <div className="day-card">
                                        <div className="day-card-corner-decoration">&#10022;</div>
                                        <div className="day-card-content">
                                            <p className="text-3xl gold-text mb-3 text-center" style={{ fontFamily: "'Cinzel', serif" }}>Irish Newspapers &amp; Media</p>
                                            <p className="leading-relaxed mb-4 italic">Read a local paper every morning. You\'ll come home knowing what the country is actually thinking.</p>
                                            <div className="media-grid">
                                                {mediaList.map((m, i) => (
                                                    <div key={i} className="media-card">
                                                        <div className="media-name"><a href={m.url} target="_blank" rel="noopener noreferrer">{m.name}</a></div>
                                                        <div className="media-desc">{m.desc}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Existing heritage topics */}
                                    <div className="day-card">
                                        <div className="day-card-corner-decoration">&#10022;</div>
                                        <div className="day-card-content">
                                            <p className="text-3xl gold-text mb-10 text-center" style={{ fontFamily: "'Cinzel', serif" }}>Irish Heritage Topics</p>

                                            <div className="section-title">The Book of Kells</div>
                                            <p className="mb-5 leading-relaxed">An 8th-century illuminated manuscript created by Celtic monks at Kells monastery around 800 AD. One of the world's most beautifully decorated medieval books, with intricate Celtic knotwork, spirals, and sacred geometry that represents the apex of monastic artistry.</p>

                                            <div className="section-title">The Troubles (1969–1998)</div>
                                            <p className="mb-5 leading-relaxed">A 30-year conflict in Northern Ireland between Catholic nationalists (seeking Irish reunification) and Protestant unionists (supporting British rule). Over 3,500 people died. The Good Friday Agreement (1998) brought peace. Belfast is now a thriving, creative city where healing is visible everywhere.</p>

                                            <div className="section-title">Irish Language (Gaeilge)</div>
                                            <p className="mb-5 leading-relaxed">Dingle Peninsula is a Gaeltacht region where 75% of locals speak Irish daily. The language nearly died in the 20th century but is now protected and celebrated as a living, vibrant part of Irish identity.</p>
                                            <p className="text-sm mb-4 bg-amber-50 p-4 border-l-4 border-amber-900">
                                                <strong>Key Phrases:</strong><br/>
                                                &bull; Dia duit (hello, literally "God be with you")<br/>
                                                &bull; Go raibh maith agat (thank you)<br/>
                                                &bull; Sláinte (cheers, literally "health")
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* CHECKLIST TAB */}
                            {activeTab === 'checklist' && (
                                <div className="space-y-10">
                                    <div className="day-card">
                                        <div className="day-card-corner-decoration">&#10022;</div>
                                        <div className="day-card-content">
                                            <p className="text-3xl gold-text mb-8 text-center" style={{ fontFamily: "'Cinzel', serif" }}>Preparation Checklist</p>
                                            <div className="space-y-4">
                                                {preTripchecklist.map((item, idx) => (
                                                    <div
                                                        key={idx}
                                                        onClick={() => toggleChecklist(idx)}
                                                        className={`p-4 rounded cursor-pointer border-l-4 transition-all ${checkedItems[idx] ? 'bg-green-100 border-green-700 opacity-60' : 'bg-amber-50 border-amber-900 hover:bg-amber-100'}`}
                                                    >
                                                        <div className="flex items-center gap-4">
                                                            <div className={`w-6 h-6 border-2 flex items-center justify-center rounded text-sm font-bold flex-shrink-0 ${checkedItems[idx] ? 'bg-green-700 border-green-700 text-white' : 'border-amber-900'}`}>
                                                                {checkedItems[idx] && '\u2713'}
                                                            </div>
                                                            <span className={`${checkedItems[idx] ? 'line-through text-gray-500' : 'text-amber-900'}`}>{item}</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="mt-8 p-5 bg-amber-100 rounded border-3 border-amber-900">
                                                <p className="font-bold gold-text text-lg">Progress: {Object.values(checkedItems).filter(Boolean).length} / {preTripchecklist.length} Completed</p>
                                                <div className="w-full bg-amber-200 rounded-full h-5 overflow-hidden mt-4 border border-amber-900">
                                                    <div
                                                        className="bg-gradient-to-r from-amber-700 to-amber-900 h-full transition-all"
                                                        style={{ width: `${(Object.values(checkedItems).filter(Boolean).length / preTripchecklist.length) * 100}%` }}
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* OTHER TAB — Budget tracker for Pam & Emily */}
                            {activeTab === 'other' && (() => {
                                const totals = budgetItems.reduce((acc, it) => {
                                    if (it.amount === null) return acc;
                                    acc[it.currency] = (acc[it.currency] || 0) + it.amount;
                                    return acc;
                                }, {});
                                const byCategory = budgetItems.reduce((acc, it) => {
                                    (acc[it.category] = acc[it.category] || []).push(it);
                                    return acc;
                                }, {});
                                const categoryOrder = ['Flights', 'Hotels', 'Car Rental', 'Activities', 'Dining'];
                                return (
                                    <div className="space-y-10">
                                        <div className="day-card">
                                            <div className="day-card-corner-decoration">&#10022;</div>
                                            <div className="day-card-content">
                                                <p className="text-3xl gold-text mb-2 text-center" style={{ fontFamily: "'Cinzel', serif" }}>Budget Tracker</p>
                                                <p className="text-center gold-text mb-4 italic">For Pam &amp; Emily \u2014 confirmed bookings, balances, and what still needs paying</p>
                                                <div style={{ background: 'linear-gradient(135deg, rgba(255,215,0,0.18) 0%, rgba(212,165,116,0.12) 100%)', border: '2px solid #8b4513', borderRadius: '2px', padding: '14px 18px', marginBottom: '20px', fontStyle: 'italic', textAlign: 'center', color: '#1a0f0a' }}>
                                                    Quiet tab \u2014 prices live here so the day-by-day pages stay clean.
                                                </div>

                                                {/* Totals by currency */}
                                                <div className="section-title">Running Totals (by currency)</div>
                                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '12px', margin: '12px 0 18px 0' }}>
                                                    {Object.entries(totals).map(([cur, total]) => (
                                                        <div key={cur} style={{
                                                            background: 'linear-gradient(135deg, rgba(212,165,116,0.3) 0%, rgba(139,69,19,0.18) 100%)',
                                                            border: '3px solid #8b4513', borderRadius: '2px', padding: '16px', textAlign: 'center',
                                                            boxShadow: '0 4px 10px rgba(0,0,0,0.15)'
                                                        }}>
                                                            <div style={{ fontFamily: "'Cinzel', serif", fontSize: '13px', color: '#8b4513', letterSpacing: '2px' }}>{cur}</div>
                                                            <div style={{ fontFamily: "'Cinzel', serif", fontSize: '26px', fontWeight: 'bold', color: '#1a0f0a', marginTop: '4px' }}>{fmtMoney(total, cur)}</div>
                                                        </div>
                                                    ))}
                                                </div>

                                                {/* Grand totals converted to EUR & USD */}
                                                {(() => {
                                                    const eurTotal = budgetItems.reduce((s, it) => s + (it.amount === null ? 0 : toEur(it.amount, it.currency)), 0);
                                                    const usdTotal = eurTotal * exchangeRates.eurUsd;
                                                    return (
                                                        <>
                                                            <div className="section-title">Grand Total (everything converted)</div>
                                                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '12px', margin: '12px 0 8px 0' }}>
                                                                <div style={{
                                                                    background: 'linear-gradient(135deg, #8b4513 0%, #6b3410 100%)',
                                                                    border: '3px solid #8b4513', borderRadius: '2px', padding: '20px', textAlign: 'center',
                                                                    boxShadow: '0 6px 14px rgba(0,0,0,0.3)'
                                                                }}>
                                                                    <div style={{ fontFamily: "'Cinzel', serif", fontSize: '13px', color: '#ffd700', letterSpacing: '2px' }}>TOTAL IN EUR</div>
                                                                    <div style={{ fontFamily: "'Cinzel', serif", fontSize: '32px', fontWeight: 'bold', color: '#ffd700', marginTop: '6px' }}>{fmtMoney(eurTotal, 'EUR')}</div>
                                                                </div>
                                                                <div style={{
                                                                    background: 'linear-gradient(135deg, #8b4513 0%, #6b3410 100%)',
                                                                    border: '3px solid #8b4513', borderRadius: '2px', padding: '20px', textAlign: 'center',
                                                                    boxShadow: '0 6px 14px rgba(0,0,0,0.3)'
                                                                }}>
                                                                    <div style={{ fontFamily: "'Cinzel', serif", fontSize: '13px', color: '#ffd700', letterSpacing: '2px' }}>TOTAL IN USD</div>
                                                                    <div style={{ fontFamily: "'Cinzel', serif", fontSize: '32px', fontWeight: 'bold', color: '#ffd700', marginTop: '6px' }}>{fmtMoney(usdTotal, 'USD')}</div>
                                                                </div>
                                                            </div>
                                                            <p style={{ textAlign: 'center', fontSize: '12px', color: '#8b4513', fontStyle: 'italic', marginBottom: '24px' }}>
                                                                Converted at \u20AC1 = ${exchangeRates.eurUsd.toFixed(4)} USD &nbsp;\u00B7&nbsp; \u20AC1 = \u00A3{exchangeRates.eurGbp.toFixed(4)} GBP &nbsp;\u00B7&nbsp; rates as of {exchangeRates.asOf} (frankfurter.dev)
                                                            </p>
                                                        </>
                                                    );
                                                })()}

                                                {/* Per-category lists */}
                                                {categoryOrder.map(cat => byCategory[cat] && (
                                                    <div key={cat} style={{ marginBottom: '24px' }}>
                                                        <div className="section-title">{cat}</div>
                                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: '10px', margin: '12px 0' }}>
                                                            {byCategory[cat].map((it, i) => {
                                                                const st = statusLabels[it.status] || { label: it.status, color: '#8b4513' };
                                                                return (
                                                                    <div key={i} style={{
                                                                        background: 'linear-gradient(135deg, rgba(250,246,240,0.92) 0%, rgba(245,240,232,0.88) 100%)',
                                                                        border: '2px solid #d4a574', borderLeft: `5px solid ${st.color}`,
                                                                        borderRadius: '2px', padding: '14px 16px',
                                                                        display: 'grid', gridTemplateColumns: '1fr auto', gap: '10px', alignItems: 'center'
                                                                    }}>
                                                                        <div>
                                                                            <div style={{ fontFamily: "'Cinzel', serif", fontWeight: 'bold', color: '#8b4513', fontSize: '15px' }}>{it.desc}</div>
                                                                            <div style={{ color: '#555', fontSize: '13px', marginTop: '4px' }}>
                                                                                <b>{it.date}</b> &nbsp;\u00B7&nbsp; {it.provider} &nbsp;\u00B7&nbsp; ref {it.ref} &nbsp;\u00B7&nbsp; booked by {it.who}
                                                                            </div>
                                                                            <span style={{
                                                                                display: 'inline-block', marginTop: '6px',
                                                                                fontSize: '11px', fontWeight: 'bold', textTransform: 'uppercase', letterSpacing: '1px',
                                                                                padding: '3px 9px', borderRadius: '12px',
                                                                                background: st.color, color: '#fff'
                                                                            }}>{st.label}</span>
                                                                        </div>
                                                                        <div style={{
                                                                            fontFamily: "'Cinzel', serif", fontSize: '20px', fontWeight: 'bold',
                                                                            color: it.amount === null ? '#b91c1c' : '#1a0f0a', whiteSpace: 'nowrap'
                                                                        }}>
                                                                            {fmtMoney(it.amount, it.currency)}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ))}

                                                <div className="section-title">Notes</div>
                                                <div style={{ background: 'linear-gradient(135deg, rgba(139,69,19,0.12) 0%, rgba(212,165,116,0.08) 100%)', border: '2px dotted #8b4513', borderRadius: '2px', padding: '16px', fontSize: '14px', lineHeight: 1.7, color: '#1a0f0a' }}>
                                                    <ul style={{ listStyle: 'disc', paddingLeft: '22px', margin: 0 }}>
                                                        <li>Mixed currencies (EUR / GBP / USD) \u2014 leaving the totals separate to avoid forex rounding noise. Convert near settlement using the day\u2019s rate.</li>
                                                        <li>\u201CPay at hotel\u201D items haven\u2019t been charged yet \u2014 the cards on file will be charged either at check-in or 24\u201348 hrs before arrival.</li>
                                                        <li>All hotel nights are now booked. Only \u201Cpay at hotel\u201D balances and the Belfast Black Taxi cash balance remain to settle on the trip.</li>
                                                        <li>Belfast Black Taxi balance is paid in cash to the driver on the day \u2014 bring it from an ATM in Belfast city centre.</li>
                                                        <li>Splitting tips: ferry, distillery and taxi were paid by individual people \u2014 worth a quick reconciliation at the end of the trip.</li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>

                        {/* Voices of Ireland */}
                        <div className="max-w-6xl mx-auto px-6 mt-20">
                            <div className="day-card">
                                <div className="day-card-corner-decoration">&#10022;</div>
                                <div className="day-card-content">
                                    <p className="text-3xl gold-text mb-2 text-center" style={{ fontFamily: "'Cinzel', serif" }}>Voices of Ireland</p>
                                    <p className="text-center gold-text mb-8 italic">A rotating selection from forty lines by twelve Irish writers \u2014 change a tab for a new trio.</p>
                                    <div className="quotes-grid">
                                        {displayedQuotes.map((q, i) => (
                                            <div key={i} className="quote-card">
                                                <div className="quote-portrait">
                                                    <img src={q.image} alt={q.author} />
                                                </div>
                                                <div className="quote-text">{q.quote}</div>
                                                <div className="quote-author">{q.author}</div>
                                                <div className="quote-years">{q.years}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="max-w-6xl mx-auto px-6 mt-12 mb-10">
                            <div className="footer day-card">
                                <div className="celtic-corner" style={{ marginBottom: '30px' }}>&#10086;</div>
                                <p className="text-lg mb-6 leading-relaxed">May your journey be filled with beauty, laughter, unexpected kindnesses, and unforgettable moments.</p>
                                <div className="ornamental-divider">&#9670; &#9670; &#9670;</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<IrelandDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
