<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Novaks Go To Ireland</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital@0;1&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        /* === HARRY CLARKE STAINED GLASS PALETTE === */
        :root {
            --bg-primary: #1a1035;
            --bg-card: #2d1b4e;
            --bg-card-hover: #3a2460;
            --accent-gold: #c9a84c;
            --accent-gold-light: #e8c97a;
            --accent-ruby: #8b1a2e;
            --accent-ruby-light: #b8334a;
            --accent-cobalt: #1e3a6e;
            --accent-cobalt-light: #2e5499;
            --text-primary: #f2e8d5;
            --text-secondary: #c9b99a;
            --text-muted: #9a8a6a;
            --border-lead: #0d0820;
            --glow-amber: rgba(201,168,76,0.15);
            --glow-amber-strong: rgba(201,168,76,0.28);
            --glow-ruby: rgba(139,26,46,0.25);
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: 'Crimson Text', Georgia, serif;
            color: var(--text-primary);
            background: radial-gradient(ellipse at top center, #3d2b1f 0%, var(--bg-primary) 55%, var(--border-lead) 100%);
            background-attachment: fixed;
            position: relative;
        }

        /* Ireland Map as faded background — softer, deeper-blended into the indigo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('ireland-map.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: contain;
            background-attachment: fixed;
            opacity: 0.10;
            filter: hue-rotate(220deg) saturate(0.4) brightness(0.7);
            mix-blend-mode: screen;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(30,58,110,0.18) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139,26,46,0.10) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(201,168,76,0.08) 0%, transparent 60%);
            z-index: 1;
            pointer-events: none;
        }

        .manuscript-bg { position: relative; min-height: 100vh; }
        .content-wrapper { position: relative; z-index: 2; }

        .manuscript-header {
            text-align: center;
            padding: 70px 40px;
            position: relative;
            background:
                radial-gradient(ellipse at top center, rgba(61,43,31,0.55) 0%, rgba(26,16,53,0.85) 55%, rgba(13,8,32,0.95) 100%),
                url('header.png') center center / cover no-repeat;
            border: 2px solid var(--border-lead);
            border-top: 3px solid var(--accent-gold);
            border-radius: 4px;
            margin-bottom: 40px;
            box-shadow:
                inset 0 0 60px var(--glow-amber-strong),
                0 8px 40px rgba(0,0,0,0.7);
            overflow: hidden;
        }
        .manuscript-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(139,69,19,0.05) 2px, rgba(139,69,19,0.05) 4px);
            pointer-events: none;
        }
        .manuscript-header h1 {
            color: #ffd700;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.6);
        }
        .manuscript-header .gold-text,
        .manuscript-header p {
            color: #faf6f0;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.85);
        }
        .manuscript-header .celtic-corner {
            color: #ffd700;
            border-color: #ffd700;
            background: radial-gradient(circle, rgba(0,0,0,0.5) 0%, transparent 70%);
        }
        .manuscript-header .ornament-line {
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
        }
        .manuscript-header .ornamental-divider {
            color: #ffd700;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
        }
        .header-content { position: relative; z-index: 2; }

        .celtic-corner {
            width: 80px; height: 80px;
            margin: 20px auto;
            border: 3px solid #8b4513;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; color: #8b4513;
            background: radial-gradient(circle, rgba(212,165,116,0.4) 0%, transparent 70%);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.15);
        }

        .ornament-line {
            height: 3px;
            background: linear-gradient(90deg, transparent, #8b4513, transparent);
            margin: 15px auto;
            width: 60%; max-width: 300px;
        }

        /* Day card — leaded glass panel */
        .day-card {
            background: var(--bg-card);
            border: 2px solid var(--border-lead);
            border-radius: 4px;
            box-shadow:
                inset 0 0 30px var(--glow-amber),
                0 4px 20px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            padding: 0;
            margin-bottom: 30px;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .day-card:hover {
            background: var(--bg-card-hover);
            box-shadow:
                inset 0 0 40px var(--glow-amber-strong),
                0 6px 30px rgba(0,0,0,0.75);
        }

        .day-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--border-lead) 0%, var(--accent-gold) 30%, var(--accent-gold-light) 50%, var(--accent-gold) 70%, var(--border-lead) 100%);
            z-index: 2;
        }

        .day-card::after {
            content: '';
            position: absolute;
            top: 6px; right: 12px;
            width: 38px; height: 38px;
            background: radial-gradient(circle, var(--glow-amber-strong) 0%, transparent 70%);
            opacity: 0.7;
            z-index: 2;
            pointer-events: none;
        }

        .day-card.expanded {
            background: var(--bg-card-hover);
            box-shadow:
                inset 0 0 50px var(--glow-amber-strong),
                0 6px 32px rgba(0,0,0,0.75);
        }

        .day-card-corner-decoration {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            color: #8b4513;
            opacity: 0.3;
            z-index: 10;
        }

        .day-card-content {
            padding: 30px;
            position: relative;
            z-index: 1;
            color: var(--text-primary);
        }

        /* When a day is expanded with a background image, add an indigo wash so text stays legible */
        .day-card.expanded .day-card-content {
            background:
                linear-gradient(135deg, rgba(26,16,53,0.88) 0%, rgba(45,27,78,0.82) 50%, rgba(26,16,53,0.88) 100%);
        }

        .day-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--accent-gold);
            margin-bottom: 20px;
            position: relative;
        }
        .day-header > div:first-child { display: inline-block; }
        .day-header .day-highlight {
            display: inline-block;
            border-left: none;
            padding-left: 0;
            border-top: 1px solid var(--accent-gold);
            padding-top: 6px;
            margin-top: 6px;
            opacity: 0.9;
        }
        .day-header .toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
        }
        .day-header::after {
            content: '\25C6 \25C6 \25C6';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--accent-gold);
            letter-spacing: 8px;
            opacity: 0.6;
        }
        .day-date { font-family: 'Cinzel', serif; font-size: 32px; font-weight: bold; color: var(--accent-gold-light); text-shadow: 0 0 12px var(--glow-amber-strong); }
        .day-location { font-family: 'Cinzel', serif; font-size: 24px; color: var(--text-primary); margin: 8px 0; }
        .day-highlight { font-family: 'IM Fell English', serif; font-size: 17px; font-style: italic; color: var(--accent-gold-light); border-left: 3px solid var(--accent-ruby); padding-left: 12px; }

        .toggle-btn {
            font-size: 32px;
            color: var(--accent-gold);
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
            text-shadow: 0 0 10px var(--glow-amber-strong);
        }
        .toggle-btn:hover { transform: scale(1.25); color: var(--accent-gold-light); }

        .day-brief {
            background: linear-gradient(135deg, rgba(30,58,110,0.35) 0%, rgba(13,8,32,0.45) 100%);
            padding: 18px;
            border-left: 4px solid var(--accent-ruby);
            border-right: 1px solid var(--accent-gold);
            border-top: 1px solid var(--accent-gold);
            border-bottom: 1px solid var(--accent-gold);
            margin: 20px 0;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-primary);
            box-shadow: inset 0 0 18px var(--glow-amber);
        }

        .expanded-content {
            border-top: 1px solid var(--accent-gold);
            padding-top: 25px;
            margin-top: 25px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: var(--accent-gold-light);
            font-weight: bold;
            margin: 25px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--accent-gold);
            text-shadow: 0 0 12px var(--glow-amber-strong);
            text-align: center;
            letter-spacing: 1.5px;
        }

        .map-container {
            border: 2px solid var(--border-lead);
            box-shadow:
                0 0 0 1px var(--accent-gold),
                inset 0 0 30px var(--glow-amber),
                0 8px 28px rgba(0,0,0,0.65);
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
            background: var(--bg-primary);
            position: relative;
        }
        .map-container > div { width: 100%; height: 350px; }

        .map-container-vertical { max-width: 520px; margin: 0 auto; }
        .map-container-vertical > div { width: 100%; height: 720px; }

        .hotel-info {
            background: linear-gradient(135deg, rgba(30,58,110,0.30) 0%, rgba(13,8,32,0.40) 100%);
            padding: 15px;
            border-left: 4px solid var(--accent-gold);
            border-top: 1px solid var(--accent-gold);
            margin: 12px 0;
            border-radius: 4px;
            box-shadow: inset 0 0 18px var(--glow-amber);
        }
        .hotel-name { font-family: 'Cinzel', serif; font-weight: bold; color: var(--accent-gold-light); font-size: 18px; text-shadow: 0 0 10px var(--glow-amber-strong); }
        .hotel-details { font-size: 14px; color: var(--text-secondary); margin-top: 6px; font-style: italic; }

        /* Guide cards (Things to Do / Visit / Eat) — small leaded panels */
        .guide-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin: 12px 0;
        }

        .guide-card {
            background: rgba(13,8,32,0.45);
            border: 1px solid var(--accent-gold);
            border-left: 4px solid var(--accent-ruby);
            padding: 14px 16px;
            border-radius: 4px;
            box-shadow: inset 0 0 16px var(--glow-amber), 0 2px 8px rgba(0,0,0,0.4);
        }

        .guide-card-image {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 2px;
            border: 2px solid var(--border-lead);
            box-shadow: 0 0 0 1px var(--accent-gold), 0 3px 10px rgba(0,0,0,0.5);
            filter: saturate(0.85) contrast(1.1);
            margin: 0 0 12px 0;
            display: block;
        }

        .guide-card a {
            color: var(--accent-gold-light);
            text-decoration: underline;
            font-weight: bold;
        }
        .guide-card a:hover { color: var(--text-primary); }

        .guide-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .guide-name {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            font-weight: bold;
            color: var(--accent-gold-light);
        }

        .guide-type {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 9px;
            border-radius: 12px;
            background: var(--accent-cobalt);
            color: var(--accent-gold-light);
            border: 1px solid var(--accent-gold);
        }

        .guide-type.restaurant { background: var(--accent-ruby); border-color: var(--accent-gold-light); }
        .guide-type.pub { background: #2d1810; border-color: var(--accent-gold); }
        .guide-type.museum { background: var(--accent-cobalt); border-color: var(--accent-gold-light); }
        .guide-type.viewpoint { background: #2563eb; border-color: var(--accent-gold); }
        .guide-type.walk { background: #15803d; border-color: var(--accent-gold); }
        .guide-type.ancient { background: #6b4a1d; border-color: var(--accent-gold-light); }
        .guide-type.quirky { background: #7c1d6f; border-color: var(--accent-gold); }
        .guide-type.shop { background: #6d28d9; border-color: var(--accent-gold); }
        .guide-type.cafe { background: #b45309; border-color: var(--accent-gold); }
        .guide-type.site { background: var(--accent-ruby); border-color: var(--accent-gold); }

        .guide-desc { color: var(--text-primary); font-size: 14px; line-height: 1.55; margin-bottom: 6px; }
        .guide-tip {
            font-size: 13px;
            color: var(--text-secondary);
            font-style: italic;
            border-top: 1px dashed rgba(201,168,76,0.35);
            padding-top: 6px;
        }
        .guide-tip strong { color: var(--accent-gold-light); font-style: normal; }

        .fun-fact {
            background: linear-gradient(135deg, rgba(201,168,76,0.18) 0%, rgba(30,58,110,0.20) 100%);
            border: 1px solid var(--accent-gold);
            border-left: 4px solid var(--accent-gold-light);
            border-radius: 4px;
            padding: 16px 18px;
            margin: 12px 0;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-primary);
            position: relative;
            box-shadow: inset 0 0 20px var(--glow-amber);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .fun-fact::before {
            content: '\2728';
            position: absolute;
            top: -12px; left: 18px;
            background: var(--bg-card);
            padding: 2px 8px;
            border: 1px solid var(--accent-gold);
            border-radius: 12px;
            font-size: 14px;
        }

        .historical-note {
            background: linear-gradient(135deg, rgba(30,58,110,0.30) 0%, rgba(13,8,32,0.40) 100%);
            padding: 18px;
            border-left: 4px solid var(--accent-cobalt-light);
            margin: 15px 0;
            border-radius: 4px;
            font-family: 'IM Fell English', serif;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
            font-style: italic;
            box-shadow: inset 0 0 18px rgba(30,58,110,0.30);
        }

        /* Articles list */
        .articles-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .article-card {
            background: rgba(13,8,32,0.45);
            border: 1px solid var(--accent-gold);
            padding: 12px 14px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .article-card:hover {
            border-color: var(--accent-gold-light);
            transform: translateX(3px);
            box-shadow: 0 0 18px var(--glow-amber-strong);
        }

        .article-card a {
            color: var(--accent-gold-light);
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            font-family: 'Cinzel', serif;
        }
        .article-card a:hover { color: var(--text-primary); text-decoration: underline; }

        .article-source {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-primary);
            background: var(--accent-ruby);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .article-desc {
            color: var(--text-secondary);
            font-size: 13px;
            font-style: italic;
            margin-top: 4px;
        }

        /* Calendar card with Ireland postcard background — dimmed under indigo veil */
        .calendar-day-card {
            background:
                linear-gradient(135deg, rgba(26,16,53,0.78) 0%, rgba(13,8,32,0.85) 100%),
                url('ireland-postcard.png') center center / cover no-repeat;
            border: 2px solid var(--border-lead);
            border-top: 3px solid var(--accent-gold);
            border-radius: 4px;
            box-shadow:
                inset 0 0 60px var(--glow-amber),
                0 8px 32px rgba(0,0,0,0.7);
            position: relative;
            overflow: visible;
            margin-bottom: 30px;
        }
        .calendar-day-card::before { display: none; }

        /* Route map card with Ireland Map as background — dark cobalt wash */
        .route-day-card {
            background:
                linear-gradient(135deg, rgba(26,16,53,0.70) 0%, rgba(13,8,32,0.85) 100%),
                url('ireland-map.png') center center / contain no-repeat,
                var(--bg-card);
        }
        .route-day-card .day-card-content {
            background:
                linear-gradient(135deg, rgba(26,16,53,0.20) 0%, rgba(13,8,32,0.20) 100%);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            padding: 25px;
        }

        .calendar-header {
            font-family: 'Cinzel', serif;
            font-weight: bold;
            text-align: center;
            padding: 12px 5px;
            color: var(--accent-gold-light);
            font-size: 14px;
            background: rgba(13,8,32,0.55);
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            text-shadow: 0 0 8px var(--glow-amber-strong);
            letter-spacing: 1px;
        }

        .calendar-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 6px;
            border: 1px solid var(--accent-gold);
            background: rgba(13,8,32,0.55);
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-secondary);
            position: relative;
            transition: all 0.3s;
            cursor: default;
            box-shadow: inset 0 0 12px var(--glow-amber);
            overflow: hidden;
        }
        .calendar-cell:hover {
            box-shadow: 0 6px 12px rgba(0,0,0,0.15), inset 0 1px 2px rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .calendar-cell .cell-num { font-size: 18px; line-height: 1; color: var(--text-primary); }
        .calendar-cell .cell-loc {
            font-family: 'Cinzel', serif;
            font-size: 9px;
            font-weight: bold;
            color: var(--accent-gold-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
            text-align: center;
            line-height: 1.1;
            padding: 0 2px;
        }
        .calendar-cell.trip-day {
            border: 2px solid var(--accent-gold);
            box-shadow: inset 0 0 18px var(--glow-amber-strong), 0 4px 14px rgba(0,0,0,0.55);
            font-weight: bold;
            cursor: pointer;
        }
        .calendar-cell.trip-day:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: inset 0 0 22px var(--glow-amber-strong), 0 6px 18px rgba(0,0,0,0.65);
            filter: brightness(1.08);
        }
        .calendar-cell.trip-day::before {
            content: '\2605';
            position: absolute;
            top: -2px; right: 4px;
            font-size: 12px;
            color: var(--accent-gold-light);
            text-shadow: 0 0 8px var(--glow-amber-strong);
        }
        .calendar-cell.empty { background: transparent; border: none; cursor: default; box-shadow: none; }

        .calendar-month-label {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: var(--accent-gold-light);
            text-align: center;
            font-weight: bold;
            padding: 20px 0 10px 0;
            text-shadow: 0 0 10px var(--glow-amber-strong);
            letter-spacing: 2px;
        }

        .nav-button {
            font-family: 'Cinzel', serif;
            font-weight: bold;
            padding: 14px 28px;
            border: 1px solid var(--accent-gold);
            background: rgba(13,8,32,0.55);
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: inset 0 0 14px rgba(13,8,32,0.4);
        }
        .nav-button:hover {
            background: var(--accent-cobalt);
            color: var(--accent-gold-light);
            box-shadow: inset 0 0 18px var(--glow-amber), 0 0 14px var(--glow-amber-strong);
            transform: translateY(-2px);
        }
        .nav-button.active {
            background: var(--accent-cobalt);
            border-bottom: 3px solid var(--accent-gold);
            color: var(--accent-gold-light);
            box-shadow: inset 0 0 22px var(--glow-amber-strong);
        }

        .ornamental-divider {
            text-align: center;
            font-size: 22px;

                        { confirmed: true, name: "Arrival at Dublin Airport (DUB)", type: 'site', desc: "Land Terminal 2 around 8:15 AM Sun 31 May. Passport control \u2192 baggage claim \u2192 Arrivals Hall. Wheelchair service escorts through passport control and baggage.", tip: "Take the Aircoach or Dublin Express bus (\u20AC10\u201312) or a taxi (\u20AC30\u201335) to the Iveagh Garden Hotel on Harcourt Street \u2014 ~25 min. Hotel check-in is from 4 PM, but luggage storage available earlier." }
                    ],
                    funFact: 'Dublin has been a UNESCO City of Literature since 2010 — only the fourth city in the world to earn the title. Four Dublin-connected writers have won the Nobel Prize in Literature: Yeats, Shaw, Beckett, and Heaney.',
                    historical: 'Dublin was founded by Vikings around 841 AD as a slave-trading settlement along the Liffey. The name comes from "Dubh Linn" ("black pool"). For eight centuries it was the second city of the British Empire; in 1922 it became the capital of the Irish Free State.',
                    articles: [
                        { title: 'Best Pubs in Dublin', source: 'Time Out', url: 'https://www.timeout.com/dublin/bars-and-pubs/best-pubs-in-dublin', desc: 'Time Out Dublin\'s curated list of the city\'s best pubs — perfect for an arrival-night pint.' },
                        { title: '18 Fabulous Free Things to Do in Dublin', source: 'Lonely Planet', url: 'https://www.lonelyplanet.com/articles/top-free-things-to-do-in-dublin', desc: 'Museums, parks, and walks that don\'t cost a penny.' },
                        { title: "If You Were My Friend, I\'d Take You to These Local Spots in Dublin", source: 'Lonely Planet', url: 'https://getlostwithlonelyplanet.substack.com/p/if-you-were-my-friend-id-take-you-4dd', desc: "Sasha Brady\'s real Dubliner weekend list — off the tourist trail." },

                {
                    date: 'May 31',
                    location: 'Dublin',
                    highlight: 'Literary Dublin & Trinity',
                    backgroundImage: 'dublin-2.png',
                    briefing: "Step into the world of Joyce, Wilde, and Yeats. The Trinity Trails Campus Tour + Book of Kells Experience starts at 12:00 PM at the Bell Tower in Front Square — guided walk through Ireland’s oldest university, the 9th-century Book of Kells, and the staggering Long Room library. Check into the Iveagh Garden Hotel from 4 PM, then Guinness Storehouse Experience at 5:30 PM ending with a pint in the Gravity Bar at sunset.",
                    coordinates: { lat: 53.3351, lng: -6.2625 },
                    hotel: 'Iveagh Garden Hotel',
                    hotelDetails: "Deluxe Triple Room (3 adults) with complimentary breakfast at Elle\u2019s Bistro. 72/74 Harcourt Street, Dublin 2. Booking #41791 \u2014 pay at hotel. Check-in from 4 PM May 31, check-out by 12 PM June 1. Phone: +353 1 568 5500 | reservations@igh.ie",
                    guide: [
                        { confirmed: true, name: 'Trinity Trails Campus Tour & Book of Kells Experience — 12:00 PM (BOOKED)', type: 'museum', desc: "Order #445816043 (booked by Emily) — Sun 31 May, 12:00 PM start. 3 × Adult tickets (€39 each = €117): codes GMCAKUAU1L, JYE4ZNY3ES, JB0XRZJ8GP. Starting point: the Bell Tower in Front Square at Trinity College Dublin. The bundle is a guided walking tour of the campus + entry to the Book of Kells Experience and the Old Library Long Room.\n\nTrinity College was founded in 1592 by Queen Elizabeth I as the “University of Dublin” — Ireland’s oldest university and one of Europe’s great seven-college constellations. For its first 200 years Catholics were barred from admission; today it’s one of the world’s leading research universities and counts Oscar Wilde, Samuel Beckett, Bram Stoker, Jonathan Swift, Mary Robinson and Edmund Burke among its alumni. The Bell Tower (the Campanile) at the centre of Front Square dates to 1853 — student lore says walking under it when the bell rings means you’ll fail your exams.\n\nThe Book of Kells (Codex Cenannensis) is one of the most beautiful illuminated manuscripts ever made — a Latin copy of the four Gospels, written and illuminated by Celtic Christian monks around 800 AD, almost certainly begun on the Scottish island of Iona and finished or moved to the monastery at Kells, Co. Meath after Viking raids. It contains over 2,000 different decorated initials, full-page “carpet pages,” and intricate Celtic knotwork. The book was stolen from Kells in 1007, found three months later buried in a sod with its gold-and-jewelled cover ripped off, and has been kept safe at Trinity since 1661.\n\nThe Old Library’s Long Room — 65 m long, lined with 200,000 ancient books and marble busts of philosophers — was the largest single-chamber library in the world when it was built (1712–1732). It’s currently undergoing a multi-year conservation; even with works in progress it’s one of the great rooms of Europe.", tip: "Arrive 11:45 AM at the Bell Tower in Front Square. Tickets are on the Apple/Google Wallet links in Emily’s confirmation — load them onto phones before you arrive. Pam arrives in Ireland the next day, so this 3-ticket booking covers John, Rose and Emily.", link: 'https://www.tcd.ie/visitors/book-of-kells/' },
                        { name: 'National Museum of Ireland — Archaeology', type: 'museum', desc: 'Bog bodies, the Ardagh Chalice, Viking Dublin hoards. One of Europe\'s great archaeological collections — and free.', tip: 'Free entry, closed Mondays. Allow 2 hours.' },
                        { name: 'National Gallery of Ireland', type: 'museum', desc: 'Caravaggio\'s "The Taking of Christ," Vermeer, and the largest Jack B. Yeats collection in the world.', tip: 'Free entry. The Vermeer ("Woman Writing a Letter") is tucked in the Dutch room.' },
                        { confirmed: true, name: 'Guinness Storehouse Experience — 5:30 PM (BOOKED)', type: 'site', desc: "Booking #904110512 (booked by Emily for John, customer #2763244) — Sun 31 May, 5:30 PM arrival. 3 tickets: 1 × Adult + 2 × Senior (65+). St. James’s Gate, Dublin 8. Self-guided 90-minute tour with complimentary audio guide.\n\nThe story behind it: in **1759** a 34-year-old Arthur Guinness signed a now-legendary **9,000-year lease** on a derelict 4-acre brewery at St. James’s Gate for £45 a year (yes — the lease still has 7,733 years to run). His porter recipe — using roasted barley to give the dark colour and creamy head — was so successful that by 1838 St. James’s Gate was the largest brewery in Ireland, and by 1914 the largest in the world. At its peak the brewery employed thousands of Dubliners and ran its own railway, foundry, fire brigade, and even a fleet of Liffey barges that floated full kegs down the river to the docks for export.\n\nThe Storehouse itself opened to visitors in 2000 inside the brewery’s old fermentation plant (built in 1904). It’s built around a 7-storey **giant pint-glass-shaped atrium** designed to hold the equivalent of **14.3 million pints** if you filled it. You climb through floors covering ingredients (barley, hops, water, yeast), the cooperage, advertising history (the toucan! the seal balancing a pint on its nose!), the family business, and end at the **Gravity Bar** on the 7th floor with a 360° glass dome and a complimentary pint over the Dublin skyline. Currently Ireland’s most-visited tourist attraction.", tip: "Tickets are paid and non-refundable. Show the QR codes from Emily’s confirmation on arrival. Try to arrive within your 15-minute window — late arrivals get pushed to the next slot. Wheelchair/pushchair accessible throughout. Allow 90 min for the experience plus extra for the Gravity Bar pint at sunset.", link: 'https://www.guinness-storehouse.com' },
                        { name: "The Winding Stair — Dinner (Emily will send details)", type: 'restaurant', desc: "Dinner at The Winding Stair, 40 Lower Ormond Quay, Dublin 1 — a beloved bookshop-and-restaurant on the north bank of the Liffey, looking straight across at the Ha'penny Bridge. The ground floor is the original Winding Stair bookshop (founded 1982 by Kevin Connolly, one of the most romantic bookshops in Ireland and the namesake of a Yeats poem); the restaurant is one creaking flight up, in a long, narrow, candlelit Georgian room with original sash windows over the river. Owner-operator Elaine Murphy reopened it as a restaurant in 2006. The kitchen is fiercely Irish-ingredient led — fish from Kilmore Quay, beef from Hereford-cross herds, vegetables from McNally Family Farm in north Dublin, cheese from Sheridan's, oysters from Carlingford and Galway. Signature dishes: hand-cut Carlingford oysters, smoked Burren salmon, slow-cooked beef shin and Guinness, sticky toffee pudding with stout caramel.\n\nEmily is sorting reservation details and will share once confirmed.", tip: "Ground-floor bookshop is open during the day — worth a wander before going up to the restaurant. From the Iveagh Garden Hotel it's a ~20-minute walk or 5-min taxi across the river. Smart-casual." },
                        { name: 'Chapter One ★★', type: 'restaurant', desc: "Two-Michelin-star refined Irish cooking in the basement of the Dublin Writers Museum on Parnell Square. Chef-patron Mickael Viljanen (Finnish-Irish) took over in 2022 and was awarded a second star by Michelin in 2023 — Dublin’s most exciting fine-dining room. His cooking is technically dazzling but rooted in seasonal Irish produce: turbot with brown butter and verjus, native lobster, aged Hereford beef, Wicklow venison. Famous signatures: the lobster tortellini in shellfish bisque, the cep tart, his soufflé desserts.", tip: 'Book 6+ weeks ahead via chapteronedublin.com. The tasting menu is the move — the wine pairings are exceptional. Set lunch is the more accessible entry. Dress smart-casual.' },
                        { name: 'Bewley\'s Café (Grafton St)', type: 'cafe', desc: 'Historic 1927 café with Harry Clarke stained glass. Sit upstairs for the best light.', tip: 'Good for a long lunch; their cherry bun is the classic order.' },
                        { name: 'The Palace Bar', type: 'pub', desc: 'Victorian literary pub once frequented by Patrick Kavanagh and Brendan Behan. Still feels like 1890.', tip: 'The upstairs Whiskey Palace has 200+ Irish whiskeys and far fewer tourists.' },
                        { name: 'Marsh\'s Library', type: 'quirky', desc: 'Ireland\'s first public library (1707) — wooden cages where readers were locked in with rare books. Jonathan Swift was a regular.', tip: 'Only a 10-minute walk from St Patrick\'s Cathedral. €5 entry.' }
                    ],
                    funFact: 'The Book of Kells was stolen in 1007 from the monastery at Kells and found three months later in a sod, buried under turf — its gold cover ripped off. It\'s been safe at Trinity since 1661.',
                    historical: 'Trinity College was founded by Elizabeth I in 1592 as a Protestant bulwark in Catholic Ireland. For 200+ years Catholics were barred from admission. The Book of Kells was created c. 800 AD by Columban monks, probably on the Scottish island of Iona, and moved to Kells after Viking raids.',
                    articles: [
                        { title: 'Uncovering the Mysteries of the Book of Kells', source: 'Trinity College Dublin', url: 'https://www.tcd.ie/news_events/articles/2024/uncovering-the-mysteries-of-the-book-of-kells/', desc: 'Toxic pigments, hidden symmetries — a single 80mm panel holds 3 lions, 4 humans, 4 snakes, 13 birds.' },
                        { title: "Behind the Scenes of Trinity College\'s Old Library Redevelopment", source: 'Smithsonian Magazine', url: 'https://www.smithsonianmag.com/history/go-behind-the-scenes-at-an-iconic-irish-library-as-staff-move-700000-historical-treasures-into-storage-180987743/', desc: 'What happens when you have to move 700,000 historical objects into storage.' },
                        { title: 'Book of Kells — Exploring Pictish Origins', source: 'Trinity College Dublin', url: 'https://www.tcd.ie/news_events/articles/2025/book-of-kells-exploring-the-evidence-that-points-to-pictish-origins-/', desc: "Joyce called it \u201cthe most purely Irish thing we have\u201d — but its origins may be Scottish." },
                        { title: 'Book of Kells Experience', source: 'History Ireland', url: 'https://historyireland.com/book-of-kells-experiencetrinity-college-dublin/', desc: "Specialist Irish history magazine on what the new experience means for the manuscript\'s future." },
                        { title: 'Book of Kells Digital Collection', source: 'Trinity College', url: 'https://digitalcollections.tcd.ie/collections/ks65hc20t', desc: 'Browse the actual manuscript pages online — extraordinary.' }
                    ]

                {
                    date: 'June 1',
                    location: 'Dublin \u2192 Kenmare, County Kerry',
                    highlight: 'Pam Arrives \u2014 Drive to Kerry',
                    backgroundImage: 'killarney.png',
                    briefing: 'Pam arrives and you collect the Newway rental car at Dublin Airport at 10 AM, then drive south through the midlands into Kerry \u2014 a 4.5-hour journey ending in Kenmare, a heritage town nestled between mountains and the sea. Overnight at the beloved Brook Lane Hotel.',
                    coordinates: { lat: 51.8789, lng: -9.5830 },
                    hotel: "Brook Lane Hotel \u2014 The Studio",
                    hotelDetails: "Booking #7003 under Rose Novak \u2014 The Studio, 4 adults, 1 night (Mon 1 \u2192 Tue 2 Jun). Bed & Breakfast rate, pay at hotel. Check-in from 3 PM, check-out by 12 PM. Award-winning cooked-to-order breakfast at Casey\u2019s Bar & Restaurant served until 11 AM \u2014 free-range eggs from the farm, handmade sausages from their rare-breed pigs, and Eggs Benedict \u201CBrook Lane Style.\u201D Wi-Fi, flat-screen TV, bottled water on request. Nestled between the Ring of Kerry and Ring of Beara. Strict 72-hr cancellation policy. Kenmare, Co. Kerry \u2014 +353 (0)64 6642077 | info@brooklanehotel.com.",
                    guide: [
                        { confirmed: true, name: 'Newway Car Rental \u2014 Dublin Airport pickup 10:00 AM (BOOKED)', type: 'site', desc: "Booked under Emily Waight, Booking #OFZ2FM32W4. Pickup Mon 1 Jun 10:00 AM at Dublin Airport \u2192 Return Tue 9 Jun 10:00 AM, same location. Vehicle: Intermediate Estate Auto (e.g. Toyota Corolla Estate). Includes 1 \u00D7 Additional Driver, Unlimited Mileage, Collision Damage Waiver (\u20AC0 excess), Theft Protection (\u20AC0 excess), Third-Party Cover, and VAT.", tip: 'At the counter present a valid driving licence + 1 payment card in the main driver\u2019s name. Free cancellation up to 24 hrs before pickup. If you cancel within 24 hrs you get a full refund less \u20AC45.' },
                        { confirmed: true, name: "No. 35 Kenmare \u2014 Dinner 6:00 PM (BOOKED)", type: 'restaurant', desc: "Reservation #28082126 under Pamela Novak \u2014 Mon 1 Jun, 6:00 PM dinner for 4. Ground-floor table requested for John\u2019s mobility (note honored on a best-effort basis). One of Kenmare\u2019s top-rated dining rooms, on Main Street in a beautifully restored 1860s townhouse. Chef-owner Aidan McGrath\u2019s seasonal Irish cooking centers on local Kerry produce: lamb from the Beara peninsula, mussels and oysters from Kenmare Bay, beef from his own family farm, and herbs from the kitchen garden. Their craft cocktail bar at the front uses house infusions and local botanicals \u2014 worth arriving 15 min early for one. Cosy, candlelit, with Irish design touches throughout.", tip: 'Cancellation policy: \u20AC25 per person if cancelled after 12:00 PM Mon 1 Jun (under 6 hrs notice). Specific table requests aren\u2019t guaranteed but reasonable \u2014 mention the ground-floor preference again on arrival. Smart casual.' },
                        { name: 'Cahir Castle (en route)', type: 'ancient', desc: 'One of Ireland\'s largest and best-preserved castles (13th c.), on an island in the River Suir. Worth a 45-min stop just off the M8.', tip: '€5 entry; Barry Lyndon was filmed here.' },
                        { name: 'Kenmare Stone Circle', type: 'ancient', desc: 'Bronze Age (2200–500 BC) circle of 15 stones — one of the largest in southwest Ireland, 5 min from the town square.', tip: 'Free; enter through the small gate off Market Street.' },
                        { name: 'Kenmare Heritage Centre', type: 'museum', desc: 'Tiny museum covering the town\'s planned 17th-century origins and its 19th-century lace-making tradition.', tip: 'Free; 30 minutes is plenty.' },
                        { name: 'Mulcahy\'s', type: 'restaurant', desc: 'Kenmare\'s hidden fine-dining gem — Bruce Mulcahy\'s creative Irish-Asian cooking has a loyal cult following.', tip: 'Book ahead. Ask for the tasting menu.' },
                        { name: 'Packie\'s', type: 'restaurant', desc: 'Cozy, rustic bistro on Henry Street — seafood chowder, lamb, proper comfort food in a candlelit room.', tip: 'Go early (6:30pm) to snag a table without reservation.' },
                        { name: 'Crowley\'s Bar', type: 'pub', desc: 'A proper local on Henry Street — traditional music sessions several nights a week, very little tourist polish.', tip: 'Ask the bartender what nights the session is on.' },
                        { name: 'The Purple Heather', type: 'cafe', desc: 'Charming daytime café-bistro on Henry Street — excellent smoked salmon on brown bread.', tip: 'Perfect for a light lunch.' }
                    ],
                    funFact: 'Kenmare was one of Ireland\'s first planned towns, laid out in a unique X-shape by the Marquess of Lansdowne in the 1770s so three main streets would radiate from a central triangle. You can still walk the exact pattern today.',
                    historical: 'Kenmare (An Neidín, "the little nest") was founded in 1670 by Sir William Petty — the same economist who conducted the Down Survey of Ireland. The town prospered on iron smelting and later on lace-making, a craft introduced by the Poor Clare nuns in 1861 to help tenants after the Famine.',
                    articles: [
                        { title: 'Kenmare, County Kerry', source: 'Lonely Planet', url: 'https://www.lonelyplanet.com/ireland/county-kerry/kenmare', desc: 'Editor\u2019s destination guide to the town and its setting.' },
                        { title: 'The Wild Atlantic Way: A Complete Road Trip Guide', source: 'The Guardian', url: 'https://www.theguardian.com/travel/2015/may/02/wild-atlantic-way-ireland-road-trip', desc: 'The Guardian\u2019s long-form guide to the coastal route Kenmare sits on.' },
                        { title: 'Irish Examiner', source: 'Irish Examiner', url: 'https://www.irishexaminer.com/', desc: 'Cork-based daily with the best local coverage of Kerry and the southwest.' }
                    ]

                {
                    date: 'June 2',
                    location: 'Ring of Kerry \u2192 Dingle',
                    highlight: 'Wild Atlantic Way & Skellig Ring',
                    backgroundImage: 'ring-of-kerry.png',
                    briefing: "Drive the iconic Ring of Kerry — one of the world’s great coastal routes. Detour onto the wilder Skellig Ring with its views across to Skellig Michael, stop at Skelligs Chocolate Factory, and end the day in Dingle town. Dinner at Out of the Blue at 8:00 PM (Bib Gourmand seafood), then maybe a pub music session.",
                    coordinates: { lat: 52.1408, lng: -10.2677 },
                    hotel: 'Dingle Skellig Hotel',
                    hotelDetails: "Booking #R38594H under John Novak \u2014 two Classic Rooms, 4 adults total, 1 night (Tue 2 \u2192 Wed 3 Jun). Room 1 (John): double bed; Room 2 (Pamela): two single beds \u2014 adjoining rooms requested. Bed & Breakfast rate, full Irish breakfast in The Coastguard Restaurant included. Access to Leisure Club (pool, steam room, jacuzzi); Peninsula Spa treatments available for extra \u2014 pre-book. Check-in 4:00\u201311:30 PM, cancellation deadline Sun 31 May 4 PM (48-hr policy). Dingle Bay views. Manage booking at dingleskellig.com.",
                    guide: [
                        { name: 'Moll\'s Gap & Ladies\' View', type: 'viewpoint', desc: 'Two of Kerry\'s most photographed viewpoints — mountain passes looking back over the Killarney lakes.', tip: 'Avoid Avoca café crowd by arriving before 10am or after 3pm.' },
                        { name: 'Staigue Stone Fort', type: 'ancient', desc: 'One of the finest stone ringforts in Ireland, c. 300-400 AD, in a dramatic mountain amphitheater above Sneem.', tip: 'Free; €1 honesty-box for the farm access road.' },
                        { name: 'Skellig Ring (detour)', type: 'walk', desc: 'A 17 km spur off the main Ring of Kerry — narrow, spectacular, much less trafficked. Views to Skellig Michael and Little Skellig.', tip: 'Drive it anti-clockwise (Waterville → Portmagee) for the best ocean-facing views.' },
                        { name: 'Skelligs Chocolate Factory', type: 'cafe', desc: 'Artisan chocolatier on the Skellig Ring with a café and free viewing windows into the kitchen.', tip: 'Try the sea-salted caramels. Good coffee.' },
                        { name: 'Kerry Cliffs', type: 'viewpoint', desc: '300-metre Atlantic cliffs near Portmagee — genuinely as dramatic as Moher, with a tenth of the crowds.', tip: '€5 parking; stay for sunset if you can.' },
                        { name: 'Murphy\'s Ice Cream (Dingle)', type: 'quirky', desc: 'Famous Dingle ice cream made with milk from Kerry cows — flavors like sea salt, Dingle gin, brown bread.', tip: 'The Dingle sea salt is the one.' },
                        { confirmed: true, name: "Out of the Blue — Dinner 8:00 PM (BOOKED) · Bib Gourmand", type: 'restaurant', desc: "Reservation #28160232 under John Novak — Tue 2 Jun, 8:00 PM table for 4 in the Dining Room. Manuel followed up by email to confirm the booking. Tiny blue seafood shack on Dingle’s harbour and a Michelin Bib Gourmand — the most-talked-about catch-of-the-day kitchen in Ireland. Owner-chef Tim Mason runs it with a printed-each-morning menu of whatever the Dingle Bay boats landed at dawn; if nothing arrives, the door stays shut rather than serve frozen fish. No meat, no fried food, no ketchup. Expect monkfish in saffron beurre blanc, rod-caught hake, hand-dived scallops with brown butter, line-caught mackerel grilled simply, lobster from the live tank. The seafood chowder is legendary.", tip: "Cancellation policy: €30 per person if cancelled with under 5 hrs notice (after 3 PM Tue 2 Jun). The room is small and characterful — dress is casual. Call +353 66 915 0811 if running late." },
                        { name: 'Dick Mack\'s (Dingle)', type: 'pub', desc: 'Legendary half-pub, half-cobbler-shop on Green Street. Now has its own whiskey distillery out back.', tip: 'Ask for the whiskey flight. Celebrities who\'ve drunk here are literally named on floor tiles outside.' }
                    ],
                    funFact: 'Skellig Michael, visible from the Skellig Ring, played Luke Skywalker\'s planet Ahch-To in The Force Awakens and The Last Jedi. The monks who climbed its 618 stone steps 1,400 years ago would be astonished.',
                    historical: 'The Ring of Kerry follows ancient pilgrimage routes to Skellig Michael, a UNESCO World Heritage Site where monks lived in stone beehive huts from the 6th to the 12th centuries. So remote its isolation preserved it. Queen Victoria visited Ladies\' View in 1861; her ladies-in-waiting were so enraptured the viewpoint took their name.',
                    articles: [
                        { title: 'Driving the Ring of Kerry', source: 'Lonely Planet', url: 'https://www.lonelyplanet.com/articles/ring-of-kerry-road-trip', desc: 'Lonely Planet\u2019s road-trip guide to the full 179 km loop.' },
                        { title: "Skellig Michael: Ireland\u2019s Extraordinary Island Monastery", source: 'The Guardian', url: 'https://www.theguardian.com/travel/2019/apr/07/skellig-michael-ireland-monastery-star-wars', desc: 'Star Wars + 6th-century monks + how to actually visit the island.' },
                        { title: 'The Best Seafood Restaurants in Ireland', source: 'Time Out', url: 'https://www.timeout.com/ireland/restaurants/best-seafood-restaurants-ireland', desc: 'Dingle harbour is one of the best seafood stops in the country.' }
                    ]
